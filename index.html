<!DOCTYPE html>
<html lang="he" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מלך ההקפצות - משחק כדורגל</title>

    <!-- הגנות אבטחה כולל אישור חיבור ל-Firebase -->
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data: https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self' https://football-juggling-default-rtdb.firebaseio.com https://*.firebaseio.com;">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

</head>
<body class="bg-slate-900 text-white min-h-dvh flex flex-col items-center justify-between p-2">

    <!-- Top Bar -->

    <!-- Main Menu -->
    <div id="main-menu" class="w-full max-w-lg flex flex-col items-center justify-center my-auto py-3 z-20 px-2">
        <div class="text-center mb-5">
            <span class="bg-amber-500/15 text-amber-400 text-xs font-bold px-3 py-1 rounded-full border border-amber-500/30 uppercase tracking-widest">מד טעינה + משימות מתחלפות ⚡🎯</span>

            <p id="menu-subtitle" class="text-slate-400 text-sm mt-1">מלא את מד האנרגיה, השלם משימות ושבור שיאים!</p>
        </div>

        <div class="w-full space-y-3">
            <button type="button" onclick="startGame('solo')" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 p-3.5 rounded-2xl flex items-center justify-between btn-glow transition transform active:scale-95 border border-emerald-400/30 cursor-pointer">

                    <div class="w-11 h-11 bg-white/10 rounded-xl flex items-center justify-center text-xl"><i class="fa-solid fa-futbol text-emerald-300"></i></div>
                    <div class="text-right">

                    </div>

            </button>

            <button type="button" onclick="startGame('pvp')" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 p-3.5 rounded-2xl flex items-center justify-between shadow-lg transition transform active:scale-95 border border-indigo-400/30 cursor-pointer">

    <!-- Game Arena -->

    <!-- Bottom Navigation -->
    <nav class="w-full max-w-lg flex justify-around bg-slate-800/90 backdrop-blur-md p-2 rounded-2xl border border-slate-700/50 shadow-lg z-20 shrink-0">

            <span id="nav-leaderboard" class="text-[10px] font-bold">טבלת שיאים</span>

        <button type="button" onclick="openShopModal()" class="flex flex-col items-center gap-0.5 text-slate-400 hover:text-cyan-400 transition py-1 px-4 rounded-xl cursor-pointer">

    <!-- Leaderboard Modal -->
    <div id="leaderboard-modal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">

            <div class="flex justify-between items-center mb-3">
                <h2 id="lb-title" class="text-xl font-bold text-amber-400 flex items-center gap-2"><i class="fa-solid fa-trophy"></i> טבלת מובילים עולמית</h2>
                <div class="flex items-center gap-2">
                    <button type="button" onclick="loadLeaderboard(true)" title="רענן טבלה" class="text-slate-300 hover:text-emerald-400 text-sm w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center cursor-pointer transition">

                    <button type="button" onclick="closeLeaderboardModal()" class="text-slate-400 hover:text-white text-lg w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center cursor-pointer">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
            </div>

            <div class="bg-slate-800/80 p-3 rounded-2xl border border-slate-700/80 mb-3 flex flex-col gap-2">
                <div class="flex justify-between items-center text-xs">
                    <span id="lb-your-rank" class="text-cyan-400 font-bold">--</span>
                    <span class="text-emerald-400 font-bold"><span id="lb-best-lbl">השיא שלך:</span> <span id="lb-personal-best">0</span></span>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="player-name-input" maxlength="16" placeholder="הכנס את שמך לטבלה..." class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-sm text-white focus:outline-none focus:border-emerald-500">
                    <button type="button" onclick="savePlayerName()" id="lb-save-btn" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-4 py-1.5 rounded-xl transition cursor-pointer">שמור</button>
                </div>
                <div id="lb-sync-status" class="text-[11px] text-slate-400 text-center hidden"></div>
            </div>

            <div id="leaderboard-list" class="overflow-y-auto space-y-2 pr-1 flex-1">
                <div class="text-center text-slate-400 py-8 text-sm">טוען נתונים מהשרת...</div>
            </div>
        </div>
    </div>

    <!-- Shop Modal -->
    <div id="shop-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-6 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-4">
                <h2 id="shop-title" class="text-xl font-bold text-amber-400 flex items-center gap-2"><i class="fa-solid fa-store"></i> חנות המשחק</h2>
                <button type="button" onclick="closeShopModal()" class="text-slate-400 hover:text-white text-lg w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>

            <div id="shop-tabs-bar" class="grid grid-cols-4 gap-1 mb-4 bg-slate-800/60 p-1 rounded-xl">
                <button type="button" onclick="switchShopTab('skins')" id="tab-skins-btn" class="py-2 px-1 text-[11px] font-bold rounded-lg bg-emerald-600 text-white transition cursor-pointer truncate">כדור</button>
                <button type="button" onclick="switchShopTab('paddles')" id="tab-paddles-btn" class="py-2 px-1 text-[11px] font-bold rounded-lg text-slate-400 hover:text-white transition cursor-pointer truncate">פאדל</button>
                <button type="button" onclick="switchShopTab('songs')" id="tab-songs-btn" class="py-2 px-1 text-[11px] font-bold rounded-lg text-slate-400 hover:text-white transition cursor-pointer truncate">מוזיקה</button>
                <button type="button" onclick="switchShopTab('vip')" id="tab-vip-btn" class="py-2 px-1 text-[11px] font-bold rounded-lg text-slate-400 hover:text-white transition cursor-pointer truncate">יוקרה 👑</button>
            </div>

            <div id="shop-items-container" class="overflow-y-auto space-y-3 pr-1 flex-1"></div>
        </div>
    </div>

    <!-- Achievements Modal -->
    <div id="achievements-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-3xl p-6 shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-4">
                <h2 id="achieve-title" class="text-xl font-bold text-emerald-400 flex items-center gap-2"><i class="fa-solid fa-medal"></i> מערכת הישגים</h2>
                <button type="button" onclick="closeAchievementsModal()" class="text-slate-400 hover:text-white text-lg w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="achievements-container" class="overflow-y-auto space-y-3 pr-1 flex-1"></div>
        </div>
    </div>

    <script>
        // --- Cleanup Old Service Workers & Cache + Setup Standalone PWA Manifest ---
        (async function initPWAAndCleanCache() {
            if ('serviceWorker' in navigator) {
                try {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (const reg of registrations) {
                        await reg.unregister();
                    }
                } catch (e) {}
            }
            if ('caches' in window) {
                try {
                    const keys = await caches.keys();
                    for (const key of keys) {
                        await caches.delete(key);
                    }
                } catch (e) {}
            }

            try {
                const iconCanvas = document.createElement('canvas');
                iconCanvas.width = 512;
                iconCanvas.height = 512;
                const ictx = iconCanvas.getContext('2d');
                ictx.fillStyle = '#0f172a';
                ictx.fillRect(0, 0, 512, 512);
                ictx.beginPath();
                ictx.arc(256, 256, 175, 0, Math.PI * 2);
                ictx.fillStyle = '#10b981';
                ictx.fill();
                ictx.beginPath();
                ictx.arc(256, 256, 135, 0, Math.PI * 2);
                ictx.fillStyle = '#ffffff';
                ictx.fill();
                ictx.fillStyle = '#0f172a';
                ictx.beginPath();
                ictx.arc(256, 256, 42, 0, Math.PI * 2);
                ictx.fill();

                const iconDataUrl = iconCanvas.toDataURL('image/png');
                const manifestObj = {
                    name: 'מלך ההקפצות - משחק כדורגל',
                    short_name: 'הקפצות',
                    start_url: './',
                    scope: './',
                    display: 'standalone',
                    background_color: '#0f172a',
                    theme_color: '#0f172a',
                    orientation: 'portrait',
                    icons: [
                        { src: iconDataUrl, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
                        { src: iconDataUrl, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
                    ]
                };
                const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
                const manifestUrl = URL.createObjectURL(blob);
                const linkEl = document.getElementById('dynamic-manifest');
                if (linkEl) linkEl.href = manifestUrl;
            } catch (e) {}
        })();

        // --- Firebase Configuration ---
        const FIREBASE_DB_URL = "https://football-juggling-default-rtdb.firebaseio.com";
        let playerId = localStorage.getItem('juggle_player_id');
        if (!playerId) {
            playerId = 'player_' + Date.now().toString(36) + '_' + Math.random().toString(36).substring(2, 8);
            localStorage.setItem('juggle_player_id', playerId);
        }
        let playerName = localStorage.getItem('juggle_player_name') || '';
        let personalBest = parseInt(localStorage.getItem('juggle_personal_best')) || 0;
        let bestDifficulty = localStorage.getItem('juggle_best_diff') || 'medium';

        let lang = localStorage.getItem('juggle_lang') || 'he';
        const savedDiff = localStorage.getItem('juggle_difficulty');
        let difficulty = ['easy', 'medium', 'hard'].includes(savedDiff) ? savedDiff : 'medium';
        let coins = parseInt(localStorage.getItem('juggle_coins')) || 75;
        let activeSkin = localStorage.getItem('juggle_active_skin') || 'classic';
        let activePaddle = localStorage.getItem('juggle_active_paddle') || 'emerald_classic';
        let activeSong = localStorage.getItem('juggle_active_song') || 'none';
        let unlockedSkins = JSON.parse(localStorage.getItem('juggle_unlocked_skins')) || ['classic'];
        let unlockedPaddles = JSON.parse(localStorage.getItem('juggle_unlocked_paddles')) || ['emerald_classic'];
        let unlockedSongs = JSON.parse(localStorage.getItem('juggle_unlocked_songs')) || ['none'];

        // VIP / Luxury items are SINGLE-GAME consumables (active for 1 run only)
        let activeRunVip = JSON.parse(localStorage.getItem('juggle_active_run_vip')) || [];

        let achievements = JSON.parse(localStorage.getItem('juggle_achievements')) || {
            juggles_50: { progress: 0, target: 50, reward: 30, claimed: false },
            shop_2: { progress: 0, target: 2, reward: 50, claimed: false },
            score_100: { progress: 0, target: 100, reward: 100, claimed: false }
        };
        let totalPurchasesCount = parseInt(localStorage.getItem('juggle_total_purchases')) || 0;

        const POINTS_PER_LEVEL = 25;

        function computeLevelFromScore(val) {
            return Math.max(1, Math.floor(Math.max(0, val) / POINTS_PER_LEVEL) + 1);
        }

        function syncAchievementProgress() {
            const unlockedCount = unlockedSkins.length + unlockedPaddles.length + unlockedSongs.length - 3;
            achievements.shop_2.progress = Math.max(achievements.shop_2.progress, totalPurchasesCount, unlockedCount);
            achievements.juggles_50.progress = Math.max(achievements.juggles_50.progress, personalBest);
            achievements.score_100.progress = Math.max(achievements.score_100.progress, personalBest);
        }
        syncAchievementProgress();

        const translations = {
            he: {
                subtitle: "מלא את מד האנרגיה, השלם משימות ושבור שיאים!",
                soloTitle: "שבירת שיא (סולו)", soloDesc: "משימות מתחלפות, מד טעינה ומטרות בונוס",
                pvpTitle: "תחרות 1 נגד 1", pvpDesc: "דו-קרב מול בוט חכם עד 5 נקודות",
                tourneyTitle: "טורניר אלופים", tourneyDesc: "רבע גמר, חצי גמר וגמר עד הגביע",
                menu: "תפריט", tap: "גרור את השחקן והשג נקודות / משימות 🎯!",
                navAchieve: "הישגים", navLeaderboard: "טבלת שיאים", navShop: "חנות",
                lbTitle: "טבלת מובילים עולמית", lbBest: "השיא שלך:", lbSave: "שמור",
                lbRankPrefix: "הדירוג שלך:", lbNamePlaceholder: "הכנס את שמך לטבלה...",
                lbSynced: "✓ השיא מסונכרן לענן",
                shopTitle: "חנות המשחק", tabSkins: "כדור", tabPaddles: "פאדל", tabSongs: "מוזיקה", tabVip: "יוקרה 👑",
                achieveTitle: "מערכת הישגים",
                buy: "קנה", equip: "השתמש", equipped: "בשימוש", owned: "בבעלותך",
                activeOneGame: "מוכן למשחק 1", oneGameTag: "למשחק אחד",

        // --- Robust Firebase Realtime Leaderboard with Auto-Reconciliation ---
        async function syncScoreToFirebase(scoreToSync, retries = 3) {
            const validScore = Math.max(Number(scoreToSync) || 0, personalBest);
            if (validScore <= 0) return false;

            const displayName = playerName.trim() || (lang === 'he' ? 'שחקן אורח' : 'Guest Player');
            const payload = {
                name: displayName,
                score: validScore,
                difficulty: bestDifficulty || difficulty,
                updatedAt: Date.now()
            };

            for (let attempt = 0; attempt < retries; attempt++) {
                try {
                    const res = await fetch(`${FIREBASE_DB_URL}/leaderboard/${encodeURIComponent(playerId)}.json`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                        keepalive: true
                    });
                    if (res.ok) {
                        localStorage.setItem('juggle_last_synced_score', String(validScore));
                        const dot = document.getElementById('sync-dot');
                        if (dot) dot.classList.add('hidden');
                        return true;
                    }
                } catch (e) {
                    await new Promise(r => setTimeout(r, 400 * (attempt + 1)));
                }
            }
            const dot = document.getElementById('sync-dot');
            if (dot) dot.classList.remove('hidden');
            return false;
        }

        async function savePlayerName() {
            const input = document.getElementById('player-name-input');
            const cleanName = input.value.trim().replace(/[<>]/g, '');
            if (!cleanName) return;
            playerName = cleanName;
            localStorage.setItem('juggle_player_name', playerName);
            const btn = document.getElementById('lb-save-btn');
            btn.disabled = true;
            btn.style.opacity = '0.6';
            await syncScoreToFirebase(personalBest);
            btn.disabled = false;
            btn.style.opacity = '1';
            loadLeaderboard(true);
        }

        async function loadLeaderboard(forceSync = false) {
            const t = translations[lang];

            const statusEl = document.getElementById('lb-sync-status');
            const refreshIcon = document.getElementById('lb-refresh-icon');

            document.getElementById('player-name-input').value = playerName;

            if (refreshIcon) refreshIcon.classList.add('fa-spin');

            try {
                let res = await fetch(`${FIREBASE_DB_URL}/leaderboard.json?t=${Date.now()}`, { cache: 'no-store' });
                let data = await res.json();

                const cloudScore = (data && data[playerId]) ? Number(data[playerId].score) || 0 : 0;

                    else if (rank === 2) badge = `<span class="w-7 h-7 rounded-full bg-slate-300/20 text-slate-200 border border-slate-300/50 font-bold text-xs flex items-center justify-center shrink-0">🥈</span>`;
                    else if (rank === 3) badge = `<span class="w-7 h-7 rounded-full bg-orange-600/20 text-orange-400 border border-orange-500/50 font-bold text-xs flex items-center justify-center shrink-0">🥉</span>`;

                    const rowDiv = document.createElement('div');

        if (personalBest > 0) {
            syncScoreToFirebase(personalBest);
