        // --- Audio Engine with Unique Track per Song ---
        let audioCtx = null;
        let isAudioEnabled = true;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!isAudioEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'kick') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.12);
                    gain.gain.setValueAtTime(0.6, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'firekick') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(90, now + 0.18);
                    gain.gain.setValueAtTime(0.7, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                    osc.start(now);
                    osc.stop(now + 0.18);
                } else if (type === 'target') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(980, now + 0.18);
                    gain.gain.setValueAtTime(0.55, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                    osc.start(now);
                    osc.stop(now + 0.18);
                } else if (type === 'powerup') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'levelup') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.28);
                    gain.gain.setValueAtTime(0.6, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.28);
                    osc.start(now);
                    osc.stop(now + 0.28);
                } else if (type === 'fail') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.3);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch (e) {}
        }

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            const btn = document.getElementById('audio-toggle-btn');
            btn.innerHTML = isAudioEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark text-red-400"></i>';
            if (!isAudioEnabled && bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            } else if (isAudioEnabled && activeSong !== 'none') {
                startBGM();
            }
        }

        function startBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            const song = songsData.find(s => s.id === activeSong) || songsData[0];
            if (song.id === 'none' || !song.notes || song.notes.length === 0 || !isAudioEnabled) return;
            initAudio();
            let step = 0;
            const dur = Math.max(0.11, (song.tempo / 1000) * 0.72);
            const peakGain = song.wave === 'square' || song.wave === 'sawtooth' ? 0.035 : 0.06;

            bgmInterval = setInterval(() => {
                if (!isAudioEnabled || activeSong === 'none') return;
                try {
                    const now = audioCtx.currentTime;
                    const freq = song.notes[step % song.notes.length];
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = song.wave;
                    osc.frequency.setValueAtTime(freq, now);
                    gain.gain.setValueAtTime(peakGain, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + dur);
                    step++;
                } catch (e) {}
            }, song.tempo);
        }

        // --- Canvas & Game Engine ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameMode = 'solo';
        let gameRunning = false;
        let score = 0;
        let currentLevel = 1;
        let levelUpBanner = null;
        let particles = [];
        let floatingTexts = [];
        let animFrameId = null;

        // 1v1 & Tournament state
        let opponentScore = 0;
        let duelGoal = 5;
        let tournamentRound = 0; // 0 = Quarterfinal, 1 = Semifinal, 2 = Final
        let tournamentWins = 0;
        let endScreenOutcome = 'gameover'; // 'gameover' | 'duel_win' | 'duel_lose' | 'tourney_win'

        let combo = 0;
        let isFireMode = false;

        let chargeMeter = 0;
        let overdriveEnd = 0;
        let currentMission = { kind: 'juggles', target: 18, progress: 0 };

        let bonusTarget = null;
        let targetCooldown = 0;
        let movingObstacle = null;
        let extraSoloBall = null;

        let powerups = [];
        let powerupTimer = 0;
        let widePaddleEnd = 0;
        let slowMoEnd = 0;

        let ball = { x: 0, y: 0, vx: 0, vy: 0, radius: 20, rot: 0 };
        let player = { x: 0, y: 0, baseWidth: 90, width: 90, height: 26 };
        let bot = { x: 0, y: 0, width: 90, height: 26 };

        function isSoloMode() {
            return gameMode === 'solo';
        }

        function isDuelMode() {
            return gameMode === 'pvp' || gameMode === 'tournament';
        }

        function isOverdriveActive() {
            return Date.now() < overdriveEnd;
        }

        function getDifficultyConfig() {
            if (difficulty === 'easy') {
                return {
                    speedScale: 0.82,
                    gravityScale: 0.84,
                    kickPower: 19.5,
                    botTrack: 0.085,
                    botSpeedCap: 4.2,
                    widthBonus: 12
                };
            }
            if (difficulty === 'hard') {
                return {
                    speedScale: 1.24,
                    gravityScale: 1.2,
                    kickPower: 23.0,
                    botTrack: 0.24,
                    botSpeedCap: 9.2,
                    widthBonus: -10
                };
            }
            return {
                speedScale: 1.0,
                gravityScale: 1.0,
                kickPower: 21.0,
                botTrack: 0.145,
                botSpeedCap: 6.4,
                widthBonus: 0
            };
        }

        function getBasePlayerWidth() {
            const cfg = getDifficultyConfig();
            const vipBonus = hasVip('wide_master') ? 16 : 0;
            return Math.max(66, 90 + cfg.widthBonus + vipBonus);
        }

        function getEscalationFactor() {
            return Math.min(1.45, 1 + (currentLevel - 1) * 0.06);
        }

        function updateLevelBadge() {
            const t = translations[lang];
            if (gameMode === 'tournament') {
                const stageName = t.tourneyStages[Math.min(tournamentRound, t.tourneyStages.length - 1)];
                document.getElementById('level-badge').innerText = `🏆 ${stageName}`;
                return;
            }
            if (gameMode === 'pvp') {
                document.getElementById('level-badge').innerText = `⚔️ ${score} : ${opponentScore}`;
                return;
            }
            document.getElementById('level-badge').innerText = `${t.levelPrefix} ${currentLevel}`;
        }

        function triggerLevelUpCelebration(newLvl) {
            const t = translations[lang];
            const phrases = t.levelUpPhrases || ["WOW!"];
            const chosen = phrases[(newLvl - 2) % phrases.length] || phrases[0];
            const phraseText = chosen.replace('{lvl}', String(newLvl));
            const subText = gameMode === 'tournament'
                ? (t.tourneyStages[Math.min(tournamentRound, t.tourneyStages.length - 1)])
                : `${t.levelPrefix} ${newLvl}`;
            levelUpBanner = {
                phrase: phraseText,
                sub: subText,
                alpha: 1.0,
                scale: 0.85,
                createdAt: Date.now(),
                duration: 2100
            };
            playSound('levelup');
        }

        function handleScoreChanged() {
            document.getElementById('game-score-board').innerText = score;
            if (isSoloMode()) {
                const nextLvl = computeLevelFromScore(score);
                if (nextLvl > currentLevel) {
                    currentLevel = nextLvl;
                    updateLevelBadge();
                    triggerLevelUpCelebration(currentLevel);
                }
            } else {
                updateLevelBadge();
                updateChargeAndMissionUI();
            }
            ensureMovingObstacle();
            ensureExtraSoloBall();
            checkAchievements();
        }

        function pickNextMission() {
            const t = translations[lang];
            if (isDuelMode()) {
                updateChargeAndMissionUI();
                return;
            }
            const levelScale = Math.min(1.6, 1 + (currentLevel - 1) * 0.12);
            const pool = [
                { kind: 'juggles', target: Math.round((16 + Math.floor(Math.random() * 10)) * levelScale), progress: 0 },
                { kind: 'targets', target: Math.max(3, Math.round((3 + Math.floor(Math.random() * 2)) * Math.min(1.4, levelScale))), progress: 0 },
                { kind: 'combo', target: Math.min(9, 5 + Math.floor(Math.random() * 3) + Math.floor((currentLevel - 1) / 2)), progress: Math.min(combo, 5) }
            ];
            currentMission = pool[Math.floor(Math.random() * pool.length)];
            if (currentMission.kind === 'combo') {
                currentMission.progress = Math.min(currentMission.target, combo);
            }
            updateChargeAndMissionUI();
        }

        function addCharge(amount) {
            if (isOverdriveActive()) return;
            const boost = hasVip('overdrive_boost') ? 1.4 : 1.0;
            chargeMeter = Math.min(100, chargeMeter + amount * boost);
            if (chargeMeter >= 100) {
                chargeMeter = 0;
                overdriveEnd = Date.now() + 7000;
                playSound('powerup');
                addFloatingText('🔥 OVERDRIVE x2!', canvas.width / 2, canvas.height * 0.32, '#f97316');
            }
            updateChargeAndMissionUI();
        }

        function advanceMission(kind, amountOrSet = 1, isAbsolute = false) {
            if (!isSoloMode() || !currentMission || currentMission.kind !== kind) return;
            if (isAbsolute) {
                currentMission.progress = Math.max(currentMission.progress, amountOrSet);
            } else {
                currentMission.progress += amountOrSet;
            }
            if (currentMission.progress >= currentMission.target) {
                const magnetBonus = hasVip('coin_magnet') ? 2 : 0;
                score += 4;
                coins += 3 + magnetBonus;
                saveGameData();
                handleScoreChanged();
                addFloatingText(`⭐ +4 | +${3 + magnetBonus} 🪙`, canvas.width / 2, canvas.height * 0.25, '#34d399');
                pickNextMission();
            } else {
                updateChargeAndMissionUI();
            }
        }

        function updateChargeAndMissionUI() {
            const t = translations[lang];
            const barEl = document.getElementById('charge-bar-fill');
            const pctEl = document.getElementById('charge-pct');
            const lblEl = document.getElementById('charge-label');
            const mTextEl = document.getElementById('mission-text');
            const mProgEl = document.getElementById('mission-progress');

            if (isOverdriveActive()) {
                const remSec = Math.max(1, Math.ceil((overdriveEnd - Date.now()) / 1000));
                lblEl.innerText = `${t.overdriveLbl} (${remSec}s)`;
                barEl.style.width = '100%';
                pctEl.innerText = 'x2';
            } else {
                lblEl.innerText = t.chargeLbl;
                barEl.style.width = `${chargeMeter}%`;
                pctEl.innerText = `${Math.floor(chargeMeter)}%`;
            }

            if (isDuelMode()) {
                mTextEl.innerText = t.duelMission
                    .replace('{p}', String(score))
                    .replace('{b}', String(opponentScore))
                    .replace('{goal}', String(duelGoal));
                mProgEl.innerText = `${score}/${duelGoal}`;
                return;
            }

            let title = '';
            if (currentMission.kind === 'juggles') title = t.mJuggles.replace('{n}', currentMission.target);
            else if (currentMission.kind === 'targets') title = t.mTargets.replace('{n}', currentMission.target);
            else title = t.mCombo.replace('{n}', currentMission.target);

            mTextEl.innerText = title;
            mProgEl.innerText = `${Math.min(currentMission.progress, currentMission.target)}/${currentMission.target}`;
        }

        function spawnBonusTarget() {
            if (!isSoloMode()) return;
            const cfg = getDifficultyConfig();
            const margin = 48;
            const minY = 75;
            const maxY = Math.max(minY + 40, canvas.height * 0.52);
            bonusTarget = {
                x: Math.random() * Math.max(40, canvas.width - margin * 2) + margin,
                y: Math.random() * (maxY - minY) + minY,
                radius: 24,
                vx: (Math.random() > 0.5 ? 1 : -1) * (1.1 + Math.min(2.0, currentLevel * 0.14)) * cfg.speedScale,
                pulse: 0
            };
        }

        function ensureMovingObstacle() {
            if (!isSoloMode()) {
                movingObstacle = null;
                return;
            }
            const cfg = getDifficultyConfig();
            if (score >= 30 && !movingObstacle) {
                movingObstacle = {
                    x: canvas.width / 2 - 36,
                    y: canvas.height * 0.44,
                    width: 72,
                    height: 14,
                    vx: (1.8 + Math.min(2.4, (score - 30) * 0.035)) * cfg.speedScale
                };
            }
        }

        function ensureExtraSoloBall() {
            if (!isSoloMode()) {
                extraSoloBall = null;
                return;
            }
            const cfg = getDifficultyConfig();
            if (score >= 50 && !extraSoloBall) {
                extraSoloBall = {
                    x: canvas.width * 0.35,
                    y: canvas.height * 0.32,
                    vx: 2.2 * cfg.speedScale,
                    vy: -8 * cfg.speedScale,
                    radius: 16,
                    rot: 0
                };
                addFloatingText('⚽ כדור בונוס בסולו!', canvas.width / 2, canvas.height * 0.35, '#38bdf8');
            }
        }

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = Math.max(300, Math.floor(rect.width));
            canvas.height = Math.max(340, Math.floor(rect.height));
        }

        window.addEventListener('resize', () => {
            if (gameRunning) resizeCanvas();
        });

        function setupMatchForMode(mode, keepTournamentProgress = false) {
            gameMode = mode;
            resizeCanvas();
            player.baseWidth = getBasePlayerWidth();
            player.width = player.baseWidth;
            bot.width = difficulty === 'hard' ? 96 : difficulty === 'easy' ? 78 : 88;
            resetPositions();

            if (!keepTournamentProgress) {
                tournamentRound = 0;
                tournamentWins = 0;
                score = 0;
            }

            opponentScore = 0;
            duelGoal = mode === 'tournament' ? 3 + tournamentRound : 5;
            currentLevel = 1;
            levelUpBanner = null;
            combo = 0;
            isFireMode = false;
            chargeMeter = hasVip('hot_start') ? 50 : 0;
            overdriveEnd = 0;
            powerups = [];
            particles = [];
            floatingTexts = [];
            widePaddleEnd = 0;
            slowMoEnd = 0;
            powerupTimer = 0;
            targetCooldown = 0;
            movingObstacle = null;
            extraSoloBall = null;

            if (isSoloMode()) {
                spawnBonusTarget();
            } else {
                bonusTarget = null;
                const t = translations[lang];
                const stageBanner = mode === 'tournament'
                    ? (t.tourneyStages[Math.min(tournamentRound, t.tourneyStages.length - 1)])
                    : t.pvpTitle;
                levelUpBanner = {
                    phrase: `⚔️ ${stageBanner}`,
                    sub: `${t.duelMission.replace('{p}', '0').replace('{b}', '0').replace('{goal}', String(duelGoal))}`,
                    alpha: 1.0,
                    scale: 0.9,
                    createdAt: Date.now(),
                    duration: 1700
                };
            }

            pickNextMission();
            document.getElementById('combo-badge').classList.add('hidden');
            document.getElementById('game-score-board').innerText = score;
            updateLevelBadge();
            startBGM();
        }

        function startGame(mode, keepTournamentProgress = false) {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            canvas.onclick = null;
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            setupMatchForMode(mode, keepTournamentProgress);
            gameRunning = true;
            animFrameId = requestAnimationFrame(gameLoop);
        }

        function returnToMenu() {
            gameRunning = false;
            canvas.onclick = null;
            if (animFrameId) cancelAnimationFrame(animFrameId);
            if (bgmInterval) clearInterval(bgmInterval);
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            updateUIStrings();
        }

        function resetPositions(serveTowardPlayer = false) {
            const cfg = getDifficultyConfig();
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.vx = (Math.random() - 0.5) * 3.8 * cfg.speedScale;
            ball.vy = (serveTowardPlayer ? 5.2 : -6.0) * cfg.speedScale;
            ball.rot = 0;

            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - 65;

            if (isDuelMode()) {
                bot.x = canvas.width / 2 - bot.width / 2;
                bot.y = 35;
            }
        }

        function updatePaddleFromPointer(e) {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const touchX = e.clientX - rect.left;
            player.x = touchX - player.width / 2;
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
        }

        canvas.addEventListener('pointermove', updatePaddleFromPointer);
        canvas.addEventListener('pointerdown', updatePaddleFromPointer);

        function addFloatingText(text, x, y, color) {
            floatingTexts.push({ text, x, y, life: 1.0, color });
        }

        function spawnPowerup() {
            const types = [
                { type: 'wide', color: '#10b981', icon: '↔️' },
                { type: 'coin', color: '#fbbf24', icon: '🪙' },
                { type: 'slow', color: '#38bdf8', icon: '❄️' }
            ];
            const chosen = types[Math.floor(Math.random() * types.length)];
            powerups.push({
                x: Math.random() * (canvas.width - 60) + 30,
                y: Math.random() * (canvas.height * 0.45) + 100,
                radius: 18,
                type: chosen.type,
                color: chosen.color,
                icon: chosen.icon,
                pulse: 0
            });
        }

        function awardDuelPointToPlayer(reasonText = '🎯 +1') {
            const pts = isOverdriveActive() ? 2 : 1;
            score += pts;
            addFloatingText(`${reasonText} (+${pts})`, canvas.width / 2, canvas.height * 0.36, '#34d399');
            handleScoreChanged();

            if (score >= duelGoal) {
                playSound('levelup');
                gameRunning = false;
                if (bgmInterval) clearInterval(bgmInterval);
                if (gameMode === 'tournament') {
                    tournamentWins++;
                    if (tournamentRound < 2) {
                        tournamentRound++;
                        endScreenOutcome = 'tourney_next';
                    } else {
                        endScreenOutcome = 'tourney_win';
                    }
                } else {
                    endScreenOutcome = 'duel_win';
                }
                showGameOverScreen();
                return true;
            }
            resetPositions(false);
            return false;
        }

        function awardDuelPointToBot() {
            opponentScore++;
            playSound('fail');
            addFloatingText('🤖 +1', canvas.width / 2, canvas.height * 0.36, '#f87171');
            updateLevelBadge();
            updateChargeAndMissionUI();

            if (opponentScore >= duelGoal) {
                gameRunning = false;
                if (bgmInterval) clearInterval(bgmInterval);
                endScreenOutcome = 'duel_lose';
                showGameOverScreen();
                return true;
            }
            resetPositions(true);
            return false;
        }

        function applyKickToBall(targetBall, isPrimaryBall) {
            const cfg = getDifficultyConfig();
            const paddleCenter = player.x + player.width / 2;
            const distFromCenter = Math.abs(targetBall.x - paddleCenter);
            const isSweetSpot = distFromCenter <= player.width * 0.28;

            if (isPrimaryBall) {
                if (isSweetSpot) {
                    combo++;
                    if (combo >= 5 && !isFireMode) {
                        isFireMode = true;
                        document.getElementById('combo-badge').classList.remove('hidden');
                        addFloatingText('🔥 FIRE MODE x2!', targetBall.x, targetBall.y - 35, '#f97316');
                    } else if (combo > 1) {
                        addFloatingText(`COMBO x${combo}`, targetBall.x, targetBall.y - 25, '#fbbf24');
                    }
                    advanceMission('combo', combo, true);
                } else {
                    combo = 0;
                    isFireMode = false;
                    chargeMeter = Math.max(0, chargeMeter - 12);
                    document.getElementById('combo-badge').classList.add('hidden');
                }
                addCharge(isSweetSpot ? 22 : 12);
            }

            playSound(isFireMode ? 'firekick' : 'kick');
            if (navigator.vibrate) try { navigator.vibrate(isFireMode ? 80 : 45); } catch (e) {}

            const pCount = isFireMode ? 24 : 15;
            for (let i = 0; i < pCount; i++) {
                particles.push({
                    x: targetBall.x, y: targetBall.y,
                    vx: (Math.random() - 0.5) * (isFireMode ? 16 : 12),
                    vy: (Math.random() - 0.5) * (isFireMode ? 16 : 12),
                    life: 1.0,
                    color: isFireMode ? (Math.random() > 0.5 ? '#f97316' : '#ef4444') :
                        (activeSkin === 'gold' ? '#fbbf24' : activeSkin === 'neon' ? '#38bdf8' : activeSkin === 'fire' ? '#f97316' : '#ffffff')
                });
            }

            const escalation = getEscalationFactor();
            const offsetRatio = Math.max(-1, Math.min(1, (targetBall.x - paddleCenter) / (player.width / 2)));
            const baseKick = isFireMode ? cfg.kickPower + 2.2 : cfg.kickPower;
            targetBall.vy = -baseKick * Math.min(1.24, escalation);
            targetBall.vx = offsetRatio * 8.8 * cfg.speedScale * Math.min(1.25, escalation);

            if (isSoloMode()) {
                const mult = ((isPrimaryBall && isFireMode) ? 2 : 1) * (isOverdriveActive() ? 2 : 1);
                score += mult;
                advanceMission('juggles', 1, false);
                handleScoreChanged();
            }
        }

        function checkAchievements() {
            achievements.juggles_50.progress = Math.max(achievements.juggles_50.progress, score);
            achievements.score_100.progress = Math.max(achievements.score_100.progress, score);
            saveGameData();
        }

        function gameLoop() {
            if (!gameRunning) return;
            const now = Date.now();
            const cfg = getDifficultyConfig();

            if (isOverdriveActive()) {
                updateChargeAndMissionUI();
            }

            if (levelUpBanner) {
                const elapsed = now - levelUpBanner.createdAt;
                if (elapsed >= levelUpBanner.duration) {
                    levelUpBanner = null;
                } else {
                    const p = elapsed / levelUpBanner.duration;
                    levelUpBanner.scale = p < 0.2 ? 0.8 + (p / 0.2) * 0.25 : 1.05 - ((p - 0.2) / 0.8) * 0.05;
                    levelUpBanner.alpha = p > 0.65 ? Math.max(0, 1 - ((p - 0.65) / 0.35)) : 1.0;
                }
            }

            player.baseWidth = getBasePlayerWidth();
            player.width = (now < widePaddleEnd) ? player.baseWidth * 1.45 : player.baseWidth;
            const escalation = getEscalationFactor();
            const slowFactor = (now < slowMoEnd) ? 0.65 : 1.0;
            const moveScale = slowFactor * cfg.speedScale * Math.min(1.28, escalation);
            const gravScale = slowFactor * cfg.gravityScale * Math.min(1.24, escalation);

            powerupTimer++;
            if (powerupTimer > 420 && powerups.length < 2) {
                spawnPowerup();
                powerupTimer = 0;
            }

            if (isSoloMode()) {
                if (!bonusTarget) {
                    targetCooldown++;
                    if (targetCooldown > 150) {
                        spawnBonusTarget();
                        targetCooldown = 0;
                    }
                } else {
                    bonusTarget.pulse += 0.08;
                    bonusTarget.x += bonusTarget.vx * moveScale;
                    if (bonusTarget.x - bonusTarget.radius < 12) {
                        bonusTarget.x = 12 + bonusTarget.radius;
                        bonusTarget.vx *= -1;
                    } else if (bonusTarget.x + bonusTarget.radius > canvas.width - 12) {
                        bonusTarget.x = canvas.width - 12 - bonusTarget.radius;
                        bonusTarget.vx *= -1;
                    }

                    const distTarget = Math.hypot(ball.x - bonusTarget.x, ball.y - bonusTarget.y);
                    if (distTarget < ball.radius + bonusTarget.radius) {
                        playSound('target');
                        const targetPts = 3 * (isOverdriveActive() ? 2 : 1);
                        score += targetPts;
                        coins += 2;
                        addCharge(30);
                        advanceMission('targets', 1, false);
                        saveGameData();
                        handleScoreChanged();
                        addFloatingText(`🎯 +${targetPts} | +2 🪙`, bonusTarget.x, bonusTarget.y - 10, '#f43f5e');

                        for (let i = 0; i < 18; i++) {
                            particles.push({
                                x: bonusTarget.x, y: bonusTarget.y,
                                vx: (Math.random() - 0.5) * 12,
                                vy: (Math.random() - 0.5) * 12,
                                life: 1.0,
                                color: i % 2 === 0 ? '#f43f5e' : '#fbbf24'
                            });
                        }
                        bonusTarget = null;
                        targetCooldown = 0;
                    }
                }

                if (movingObstacle) {
                    movingObstacle.x += movingObstacle.vx * moveScale;
                    if (movingObstacle.x < 10) {
                        movingObstacle.x = 10;
                        movingObstacle.vx = Math.abs(movingObstacle.vx);
                    } else if (movingObstacle.x + movingObstacle.width > canvas.width - 10) {
                        movingObstacle.x = canvas.width - 10 - movingObstacle.width;
                        movingObstacle.vx = -Math.abs(movingObstacle.vx);
                    }

                    const closestX = Math.max(movingObstacle.x, Math.min(ball.x, movingObstacle.x + movingObstacle.width));
                    const closestY = Math.max(movingObstacle.y, Math.min(ball.y, movingObstacle.y + movingObstacle.height));
                    const dxObs = ball.x - closestX;
                    const dyObs = ball.y - closestY;
                    if (dxObs * dxObs + dyObs * dyObs < ball.radius * ball.radius) {
                        playSound('kick');
                        if (ball.y < movingObstacle.y + movingObstacle.height / 2) {
                            ball.vy = -Math.abs(ball.vy) * 0.9 - 3;
                            ball.y = movingObstacle.y - ball.radius - 1;
                        } else {
                            ball.vy = Math.abs(ball.vy) * 0.9 + 3;
                            ball.y = movingObstacle.y + movingObstacle.height + ball.radius + 1;
                        }
                        ball.vx += (ball.x - (movingObstacle.x + movingObstacle.width / 2)) * 0.14;
                        addFloatingText('⚡ הסטה!', ball.x, ball.y - 18, '#a855f7');
                    }
                }
            }

            ball.vy += 0.42 * gravScale;
            ball.x += ball.vx * moveScale;
            ball.y += ball.vy * moveScale;
            ball.vx *= 0.99;
            ball.rot += ball.vx * 0.05;

            if (isFireMode || isOverdriveActive()) {
                particles.push({
                    x: ball.x + (Math.random() - 0.5) * 12,
                    y: ball.y + (Math.random() - 0.5) * 12,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    life: 0.7,
                    color: isOverdriveActive() ? '#f43f5e' : (Math.random() > 0.4 ? '#f97316' : '#fbbf24')
                });
            }

            if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.vx *= -0.85; }
            if (ball.x + ball.radius > canvas.width) { ball.x = canvas.width - ball.radius; ball.vx *= -0.85; }

            if (isSoloMode() && extraSoloBall) {
                extraSoloBall.vy += 0.38 * gravScale;
                extraSoloBall.x += extraSoloBall.vx * moveScale;
                extraSoloBall.y += extraSoloBall.vy * moveScale;
                extraSoloBall.vx *= 0.99;
                extraSoloBall.rot += extraSoloBall.vx * 0.05;

                if (extraSoloBall.x - extraSoloBall.radius < 0) {
                    extraSoloBall.x = extraSoloBall.radius;
                    extraSoloBall.vx *= -0.85;
                } else if (extraSoloBall.x + extraSoloBall.radius > canvas.width) {
                    extraSoloBall.x = canvas.width - extraSoloBall.radius;
                    extraSoloBall.vx *= -0.85;
                }

                if (extraSoloBall.y + extraSoloBall.radius >= player.y &&
                    extraSoloBall.y - extraSoloBall.radius <= player.y + player.height &&
                    extraSoloBall.x >= player.x - 20 &&
                    extraSoloBall.x <= player.x + player.width + 20 &&
                    extraSoloBall.vy > 0) {
                    applyKickToBall(extraSoloBall, false);
                }

                if (extraSoloBall.y > canvas.height + 40) {
                    extraSoloBall = null;
                    addFloatingText('כדור בונוס יצא', canvas.width / 2, canvas.height - 95, '#94a3b8');
                }
            }

            for (let i = powerups.length - 1; i >= 0; i--) {
                const pw = powerups[i];
                pw.pulse += 0.08;
                const dx = ball.x - pw.x;
                const dy = ball.y - pw.y;
                if (Math.hypot(dx, dy) < ball.radius + pw.radius) {
                    playSound('powerup');
                    if (pw.type === 'wide') {
                        widePaddleEnd = now + 8000;
                        addFloatingText('↔️ מחבט ענק!', pw.x, pw.y, '#10b981');
                    } else if (pw.type === 'coin') {
                        coins += 5;
                        saveGameData();
                        addFloatingText('+5 🪙', pw.x, pw.y, '#fbbf24');
                    } else if (pw.type === 'slow') {
                        slowMoEnd = now + 6000;
                        addFloatingText('❄️ הילוך איטי!', pw.x, pw.y, '#38bdf8');
                    }
                    powerups.splice(i, 1);
                }
            }

            if (ball.y + ball.radius >= player.y && ball.y - ball.radius <= player.y + player.height &&
                ball.x >= player.x - 20 && ball.x <= player.x + player.width + 20 && ball.vy > 0) {
                applyKickToBall(ball, true);
            }

            if (isDuelMode()) {
                bot.y = 35;
                const roundFactor = gameMode === 'tournament' ? 1 + tournamentRound * 0.14 : 1;
                const desiredX = ball.x - bot.width / 2;
                const deltaX = desiredX - bot.x;
                const stepX = Math.max(-cfg.botSpeedCap * roundFactor, Math.min(cfg.botSpeedCap * roundFactor, deltaX * cfg.botTrack * roundFactor));
                bot.x = Math.max(0, Math.min(canvas.width - bot.width, bot.x + stepX));

                if (ball.y - ball.radius <= bot.y + bot.height + 16 && ball.vy < 0) {
                    playSound('kick');
                    if (navigator.vibrate) try { navigator.vibrate(50); } catch (e) {}

                    for (let i = 0; i < 15; i++) {
                        particles.push({
                            x: ball.x, y: ball.y,
                            vx: (Math.random() - 0.5) * 12,
                            vy: (Math.random() - 0.5) * 12,
                            life: 1.0,
                            color: '#6366f1'
                        });
                    }

                    const aimSpread = difficulty === 'hard' ? 1.1 : difficulty === 'easy' ? 1.55 : 1.35;
                    const botAngle = (Math.random() - 0.5) * aimSpread;
                    ball.vy = cfg.kickPower * Math.min(1.18, 1 + tournamentRound * 0.05);
                    ball.vx = botAngle * 7.4 * cfg.speedScale;
                }

                if (ball.y < -35) {
                    if (awardDuelPointToPlayer('⚡ נקודה!')) return;
                } else if (ball.y > canvas.height + 40) {
                    if (awardDuelPointToBot()) return;
                }
            } else if (ball.y > canvas.height + 40) {
                playSound('fail');
                gameRunning = false;
                if (bgmInterval) clearInterval(bgmInterval);
                endScreenOutcome = 'gameover';
                showGameOverScreen();
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();

            if (isSoloMode() && bonusTarget) {
                ctx.save();
                const rOuter = bonusTarget.radius + Math.sin(bonusTarget.pulse) * 3;
                ctx.beginPath();
                ctx.arc(bonusTarget.x, bonusTarget.y, rOuter, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(244, 63, 94, 0.18)';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#f43f5e';
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(bonusTarget.x, bonusTarget.y, bonusTarget.radius * 0.52, 0, Math.PI * 2);
                ctx.strokeStyle = '#fbbf24';
                ctx.lineWidth = 2.5;
                ctx.stroke();

                ctx.font = '15px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🎯', bonusTarget.x, bonusTarget.y);
                ctx.restore();
            }

            if (isSoloMode() && movingObstacle) {
                ctx.save();
                ctx.fillStyle = '#a855f7';
                ctx.shadowColor = '#a855f7';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.roundRect(movingObstacle.x, movingObstacle.y, movingObstacle.width, movingObstacle.height, 8);
                ctx.fill();
                ctx.restore();
            }

            powerups.forEach(pw => {
                ctx.save();
                ctx.beginPath();
                ctx.arc(pw.x, pw.y, pw.radius + Math.sin(pw.pulse) * 3, 0, Math.PI * 2);
                ctx.fillStyle = pw.color + '33';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = pw.color;
                ctx.stroke();

                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(pw.icon, pw.x, pw.y);
                ctx.restore();
            });

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.035;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, isFireMode ? 5 : 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }

            const paddleObj = paddlesData.find(p => p.id === activePaddle) || paddlesData[0];
            const paddleMainColor = (now < widePaddleEnd) ? '#34d399' : paddleObj.color;
            ctx.fillStyle = paddleMainColor;
            ctx.shadowColor = paddleMainColor;
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.roundRect(player.x, player.y, player.width, player.height, 12);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = paddleObj.accent;
            ctx.beginPath();
            ctx.roundRect(player.x + player.width * 0.3, player.y + 3, player.width * 0.4, 4, 2);
            ctx.fill();

            if (hasVip('royal_crown')) {
                ctx.font = '13px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('👑', player.x + player.width / 2, player.y - 6);
            }

            if (isDuelMode()) {
                ctx.fillStyle = '#6366f1';
                ctx.shadowColor = '#6366f1';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.roundRect(bot.x, bot.y, bot.width, bot.height, 12);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            if (isSoloMode() && extraSoloBall) {
                ctx.save();
                ctx.translate(extraSoloBall.x, extraSoloBall.y);
                ctx.rotate(extraSoloBall.rot);
                ctx.fillStyle = '#38bdf8';
                ctx.shadowColor = '#38bdf8';
                ctx.shadowBlur = 16;
                ctx.beginPath();
                ctx.arc(0, 0, extraSoloBall.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.restore();
            }

            ctx.save();
            ctx.translate(ball.x, ball.y);
            ctx.rotate(ball.rot);
            let skinObj = skinsData.find(s => s.id === activeSkin) || skinsData[0];
            ctx.fillStyle = isOverdriveActive() ? '#f43f5e' : (isFireMode ? '#f97316' : skinObj.color);
            ctx.shadowColor = isOverdriveActive() ? '#fbbf24' : (isFireMode ? '#ef4444' : skinObj.color);
            ctx.shadowBlur = (isOverdriveActive() || isFireMode) ? 28 : 18;
            ctx.beginPath();
            ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.restore();

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 1.2;
                ft.life -= 0.02;
                if (ft.life <= 0) {
                    floatingTexts.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = ft.life;
                    ctx.fillStyle = ft.color;
                    ctx.font = 'bold 16px Rubik, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(ft.text, ft.x, ft.y);
                    ctx.restore();
                }
            }

            if (levelUpBanner) {
                ctx.save();
                ctx.globalAlpha = levelUpBanner.alpha;
                ctx.translate(canvas.width / 2, canvas.height * 0.34);
                ctx.scale(levelUpBanner.scale, levelUpBanner.scale);

                const boxW = Math.min(canvas.width - 28, 320);
                const boxH = 88;
                ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
                ctx.strokeStyle = '#34d399';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.roundRect(-boxW / 2, -boxH / 2, boxW, boxH, 20);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = '#fbbf24';
                ctx.font = '900 24px Rubik, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(levelUpBanner.phrase, 0, -10);

                ctx.fillStyle = '#34d399';
                ctx.font = 'bold 15px Rubik, sans-serif';
                ctx.fillText(`⭐ ${levelUpBanner.sub} ⭐`, 0, 20);
                ctx.restore();
            }

            animFrameId = requestAnimationFrame(gameLoop);
        }

        function showGameOverScreen() {
            const t = translations[lang];
            let isNewRecord = false;
            if (score > personalBest) {
                personalBest = score;
                bestDifficulty = difficulty;
                isNewRecord = true;
                syncScoreToFirebase(personalBest);
            }

            let earnedCoins = Math.floor(score / 4);
            if (endScreenOutcome === 'duel_win') earnedCoins += 6;
            if (endScreenOutcome === 'tourney_next') earnedCoins += 5;
            if (endScreenOutcome === 'tourney_win') earnedCoins += 15;

            if (hasVip('double_coins_run') && earnedCoins > 0) {
                earnedCoins *= 2;
            }
            if (earnedCoins > 0) {
                coins += earnedCoins;
            }

            // Consume all single-game VIP items after the match/run ends
            if (endScreenOutcome !== 'tourney_next') {
                activeRunVip = [];
            }
            saveGameData();

            ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            let headline = t.gameOver;
            if (endScreenOutcome === 'duel_win') headline = t.duelWon;
            else if (endScreenOutcome === 'duel_lose') headline = t.duelLost;
            else if (endScreenOutcome === 'tourney_win') headline = t.tourneyWon;
            else if (endScreenOutcome === 'tourney_next') headline = `🏆 ${t.tourneyStages[Math.min(tournamentRound, 2)]}`;

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 26px Rubik, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(headline, canvas.width / 2, canvas.height / 2 - 55);

            ctx.fillStyle = '#34d399';
            ctx.font = 'bold 21px Rubik, sans-serif';
            const scoreSummary = isDuelMode()
                ? `${score} - ${opponentScore}`
                : `${t.scoreTxt}: ${score}`;
            ctx.fillText(scoreSummary, canvas.width / 2, canvas.height / 2 - 15);

            ctx.fillStyle = isNewRecord ? '#fbbf24' : '#94a3b8';
            ctx.font = 'bold 15px Rubik, sans-serif';
            ctx.fillText(isNewRecord ? `🏆 ${t.bestTxt}: ${personalBest}` : `${t.bestTxt}: ${personalBest}`, canvas.width / 2, canvas.height / 2 + 15);

            if (earnedCoins > 0) {
                ctx.fillStyle = '#fbbf24';
                ctx.font = '15px Rubik, sans-serif';
                ctx.fillText(`+${earnedCoins} 🪙`, canvas.width / 2, canvas.height / 2 + 42);
            }

            const btnLabel = endScreenOutcome === 'tourney_next'
                ? (t.tourneyStages[Math.min(tournamentRound, 2)])
                : t.retry;

            ctx.fillStyle = '#10b981';
            ctx.beginPath();
            ctx.roundRect(canvas.width / 2 - 95, canvas.height / 2 + 65, 190, 45, 12);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px Rubik, sans-serif';
            ctx.fillText(btnLabel, canvas.width / 2, canvas.height / 2 + 93);

            canvas.onclick = function() {
                canvas.onclick = null;
                if (endScreenOutcome === 'tourney_next') {
                    startGame('tournament', true);
                } else {
                    startGame(gameMode, false);
                }
            };
        }

        // --- Shop & Achievements Modals ---
        let currentShopTab = 'skins';

        function openShopModal() {
            switchShopTab(currentShopTab);
            document.getElementById('shop-modal').classList.remove('hidden');
        }
        function closeShopModal() {
            document.getElementById('shop-modal').classList.add('hidden');
        }

        function setShopTabVisuals(tab) {
            const skinBtn = document.getElementById('tab-skins-btn');
            const paddleBtn = document.getElementById('tab-paddles-btn');
            const songBtn = document.getElementById('tab-songs-btn');
            const vipBtn = document.getElementById('tab-vip-btn');
            const activeCls = 'py-2 px-1 text-[11px] font-bold rounded-lg bg-emerald-600 text-white transition cursor-pointer truncate';
            const idleCls = 'py-2 px-1 text-[11px] font-bold rounded-lg text-slate-400 hover:text-white transition cursor-pointer truncate';

            skinBtn.className = (tab === 'skins') ? activeCls : idleCls;
            paddleBtn.className = (tab === 'paddles') ? activeCls : idleCls;
            songBtn.className = (tab === 'songs') ? activeCls : idleCls;
            vipBtn.className = (tab === 'vip') ? activeCls : idleCls;
        }

        function switchShopTab(tab) {
            currentShopTab = tab;
            setShopTabVisuals(tab);
            renderShop(tab);
        }

        function renderShop(type) {
            setShopTabVisuals(type);
            const container = document.getElementById('shop-items-container');
            container.innerHTML = '';
            const t = translations[lang];

            if (type === 'skins') {
                skinsData.forEach(item => {
                    let isOwned = unlockedSkins.includes(item.id);
                    let isEquipped = activeSkin === item.id;
                    container.innerHTML += `
                        <div class="bg-slate-800/80 border border-slate-700/80 p-3 rounded-2xl flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl flex items-center justify-center border border-slate-600 shrink-0" style="background:${item.color}"></div>
                                <div>
                                    <div class="font-bold text-sm">${item.name[lang] || item.name.en}</div>
                                    <div class="text-xs text-amber-400 flex items-center gap-1"><i class="fa-solid fa-coins"></i> ${item.price}</div>
                                </div>
                            </div>
                            <div class="shrink-0">
                                ${isEquipped ? `<span class="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-xl font-bold">${t.equipped}</span>` :
                                    isOwned ? `<button type="button" onclick="equipSkin('${item.id}')" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-1.5 rounded-xl font-bold transition cursor-pointer">${t.equip}</button>` :
                                    `<button type="button" onclick="buySkin('${item.id}', ${item.price})" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs px-4 py-1.5 rounded-xl font-bold transition cursor-pointer">${t.buy}</button>`}
                            </div>
                        </div>
                    `;
                });
            } else if (type === 'paddles') {
                paddlesData.forEach(item => {
                    let isOwned = unlockedPaddles.includes(item.id);
                    let isEquipped = activePaddle === item.id;
                    container.innerHTML += `
                        <div class="bg-slate-800/80 border border-slate-700/80 p-3 rounded-2xl flex items-center justify-between gap-2">
                            <div class="flex items-center gap-3 min-w-0">
                                <div class="w-12 h-10 bg-slate-900 rounded-xl flex items-center justify-center border border-slate-700 shrink-0 px-1.5">
                                    <div class="w-full h-3 rounded-full flex items-center justify-center" style="background:${item.color}">
                                        <span class="w-3 h-1 rounded-full" style="background:${item.accent}"></span>
                                    </div>
                                </div>
                                <div class="min-w-0">
                                    <div class="font-bold text-sm truncate">${item.name[lang] || item.name.en}</div>
                                    <div class="text-xs text-amber-400 flex items-center gap-1"><i class="fa-solid fa-coins"></i> ${item.price}</div>
                                </div>
                            </div>
                            <div class="shrink-0">
                                ${isEquipped ? `<span class="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-xl font-bold">${t.equipped}</span>` :
                                    isOwned ? `<button type="button" onclick="equipPaddle('${item.id}')" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-1.5 rounded-xl font-bold transition cursor-pointer">${t.equip}</button>` :
                                    `<button type="button" onclick="buyPaddle('${item.id}', ${item.price})" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs px-4 py-1.5 rounded-xl font-bold transition cursor-pointer">${t.buy}</button>`}
                            </div>
                        </div>
                    `;
                });
            } else if (type === 'songs') {
                songsData.forEach(item => {
                    let isOwned = unlockedSongs.includes(item.id);
                    let isEquipped = activeSong === item.id;
                    container.innerHTML += `
                        <div class="bg-slate-800/80 border border-slate-700/80 p-3 rounded-2xl flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-slate-700 rounded-xl flex items-center justify-center text-cyan-400 shrink-0"><i class="fa-solid fa-music"></i></div>
                                <div>
                                    <div class="font-bold text-sm">${item.name[lang] || item.name.en}</div>
                                    <div class="text-xs text-amber-400 flex items-center gap-1"><i class="fa-solid fa-coins"></i> ${item.price}</div>
                                </div>
                            </div>
                            <div class="shrink-0">
                                ${isEquipped ? `<span class="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-xl font-bold">${t.equipped}</span>` :
                                    isOwned ? `<button type="button" onclick="equipSong('${item.id}')" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-1.5 rounded-xl font-bold transition cursor-pointer">${t.equip}</button>` :
                                    `<button type="button" onclick="buySong('${item.id}', ${item.price})" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs px-4 py-1.5 rounded-xl font-bold transition cursor-pointer">${t.buy}</button>`}
                            </div>
                        </div>
                    `;
                });
            } else {
                vipItemsData.forEach(item => {
                    let isActiveForNext = activeRunVip.includes(item.id);
                    container.innerHTML += `
                        <div class="bg-slate-800/80 border border-amber-500/30 p-3 rounded-2xl flex items-center justify-between gap-2">
                            <div class="flex items-center gap-3 min-w-0">
                                <div class="w-10 h-10 bg-amber-500/15 border border-amber-400/30 rounded-xl flex items-center justify-center text-lg shrink-0">${item.icon}</div>
                                <div class="min-w-0">
                                    <div class="flex items-center gap-1.5 flex-wrap">
                                        <span class="font-bold text-sm text-amber-200">${item.name[lang] || item.name.en}</span>
                                        <span class="text-[10px] bg-amber-500/15 text-amber-300 px-1.5 py-0.5 rounded-md font-semibold">${t.oneGameTag}</span>
                                    </div>
                                    <div class="text-[11px] text-slate-400">${item.desc[lang] || item.desc.en}</div>
                                    <div class="text-xs text-amber-400 flex items-center gap-1 mt-0.5"><i class="fa-solid fa-coins"></i> ${item.price}</div>
                                </div>
                            </div>
                            <div class="shrink-0">
                                ${isActiveForNext ? `<span class="text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-1.5 rounded-xl font-bold">${t.activeOneGame}</span>` :
                                    `<button type="button" onclick="buyVip('${item.id}', ${item.price})" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs px-4 py-1.5 rounded-xl font-bold transition cursor-pointer">${t.buy}</button>`}
                            </div>
                        </div>
                    `;
                });
            }
        }

        function buySkin(id, price) {
            if (unlockedSkins.includes(id)) return;
            if (coins >= price) {
                coins -= price;
                unlockedSkins.push(id);
                activeSkin = id;
                totalPurchasesCount++;
                saveGameData();
                renderShop('skins');
            } else {
                alert(lang === 'he' ? 'אין לך מספיק מטבעות!' : 'Not enough coins!');
            }
        }

        function equipSkin(id) {
            activeSkin = id;
            saveGameData();
            renderShop('skins');
        }

        function buyPaddle(id, price) {
            if (unlockedPaddles.includes(id)) return;
            if (coins >= price) {
                coins -= price;
                unlockedPaddles.push(id);
                activePaddle = id;
                totalPurchasesCount++;
                saveGameData();
                renderShop('paddles');
            } else {
                alert(lang === 'he' ? 'אין לך מספיק מטבעות!' : 'Not enough coins!');
            }
        }

        function equipPaddle(id) {
            activePaddle = id;
            saveGameData();
            renderShop('paddles');
        }

        function buySong(id, price) {
            if (unlockedSongs.includes(id)) return;
            if (coins >= price) {
                coins -= price;
                unlockedSongs.push(id);
                activeSong = id;
                totalPurchasesCount++;
                saveGameData();
                renderShop('songs');
                startBGM();
            } else {
                alert(lang === 'he' ? 'אין לך מספיק מטבעות!' : 'Not enough coins!');
            }
        }

        function equipSong(id) {
            activeSong = id;
            saveGameData();
            renderShop('songs');
            startBGM();
        }

        function buyVip(id, price) {
            if (activeRunVip.includes(id)) return;
            if (coins >= price) {
                coins -= price;
                activeRunVip.push(id);
                totalPurchasesCount++;
                saveGameData();
                renderShop('vip');
            } else {
                alert(lang === 'he' ? 'אין לך מספיק מטבעות!' : 'Not enough coins!');
            }
        }

        function openAchievementsModal() {
            syncAchievementProgress();
            saveGameData();
            renderAchievements();
            document.getElementById('achievements-modal').classList.remove('hidden');
        }
        function closeAchievementsModal() {
            document.getElementById('achievements-modal').classList.add('hidden');
        }

        function renderAchievements() {
            const container = document.getElementById('achievements-container');
            container.innerHTML = '';
            const t = translations[lang];

            const achieveList = [
                { id: 'juggles_50', title: { he: 'שולט בכדור (50 נקודות/הקפצות)', en: 'Ball Master (50 score)', ru: 'Мастер (50)', fr: 'Maître (50)' } },
                { id: 'shop_2', title: { he: 'אספן עשיר (2 רכישות בחנות)', en: 'Rich Collector (2 shop buys)', ru: 'Коллекционер (2)', fr: 'Collectionneur (2)' } },
                { id: 'score_100', title: { he: 'אגדת הקפצות (100 נקודות)', en: 'Legend (100 score)', ru: 'Легенда (100)', fr: 'Légende (100)' } }
            ];

            achieveList.forEach(item => {
                let data = achievements[item.id] || { progress: 0, target: 1, reward: 20, claimed: false };
                let currentProg = Math.min(data.target, Math.max(0, Number(data.progress) || 0));
                let isCompleted = currentProg >= data.target;
                let pct = Math.min(100, Math.round((currentProg / data.target) * 100));

                container.innerHTML += `
                    <div class="bg-slate-800/80 border border-slate-700/80 p-4 rounded-2xl flex flex-col gap-2">
                        <div class="flex justify-between items-center gap-2">
                            <div class="font-bold text-sm">${item.title[lang] || item.title.en}</div>
                            <div class="text-xs text-amber-400 font-bold flex items-center gap-1 shrink-0"><i class="fa-solid fa-coins"></i> +${data.reward}</div>
                        </div>
                        <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                            <div class="bg-emerald-500 h-full transition-all duration-300" style="width: ${pct}%"></div>
                        </div>
                        <div class="flex justify-between items-center text-xs text-slate-400">
                            <span>${currentProg} / ${data.target}</span>
                            ${data.claimed ? `<span class="text-emerald-400 font-bold">${t.claimed}</span>` :
                                isCompleted ? `<button type="button" onclick="claimAchievement('${item.id}')" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-3 py-1 rounded-xl transition cursor-pointer">${t.claim}</button>` :
                                `<span class="text-slate-500">${t.inProgress}</span>`}
                        </div>
                    </div>
                `;
            });
        }

        function claimAchievement(id) {
            const data = achievements[id];
            if (!data || data.claimed) return;
            if (Number(data.progress) >= Number(data.target)) {
                data.claimed = true;
                coins += Number(data.reward) || 0;
                saveGameData();
                renderAchievements();
            }
        }

        updateUIStrings();
    </script>
</body>
</html>
