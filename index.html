<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>מלך ההקפצות - משחק כדורגל</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="הקפצות">
    <meta name="theme-color" content="#0f172a">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Rubik', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #0f172a;
        }
        canvas {
            display: block;
            touch-action: none;
            width: 100%;
            height: 100%;
        }
        .custom-glass {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .btn-bounce {
            transition: transform 0.1s ease, background-color 0.2s ease;
            cursor: pointer;
        }
        .btn-bounce:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen w-screen flex flex-col justify-between overflow-hidden">

    <div id="game-container" class="relative w-full h-full flex items-center justify-center overflow-hidden">
        <canvas id="gameCanvas"></canvas>

        <div id="hud" class="absolute top-0 left-0 right-0 p-4 z-10 flex justify-between items-start hidden pointer-events-none">
            <div class="flex flex-col gap-2 pointer-events-auto">
                <div class="custom-glass px-4 py-2 rounded-2xl flex items-center gap-3 border-l-4 border-emerald-500 shadow-lg">
                    <i class="fa-solid fa-trophy text-amber-400 text-xl"></i>
                    <div>
                        <div id="hud-score-label" class="text-xs text-slate-400 font-bold">הקפצות</div>
                        <div id="hud-score" class="text-2xl font-black text-emerald-400">0</div>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-2 pointer-events-auto">
                <div id="hud-coins-box" class="custom-glass px-3 py-2 rounded-2xl flex items-center gap-2 border-r-4 border-amber-400">
                    <span id="hud-coins" class="text-lg font-black text-amber-400">0</span>
                    <i class="fa-solid fa-coins text-amber-400"></i>
                </div>
                <button id="pause-btn" class="custom-glass w-10 h-10 rounded-2xl flex items-center justify-center text-slate-300 hover:text-white btn-bounce">
                    <i class="fa-solid fa-pause"></i>
                </button>
            </div>
        </div>

        <div id="menu-overlay" class="absolute inset-0 z-20 flex flex-col justify-between p-6 overflow-y-auto">
            <div class="flex justify-between items-center w-full max-w-md mx-auto">
                <div class="flex gap-2">
                    <button id="lang-btn" class="custom-glass px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-2 btn-bounce">
                        <i class="fa-solid fa-globe text-emerald-400"></i>
                        <span>עברית</span>
                    </button>
                    <button id="diff-btn" class="custom-glass px-3 py-2 rounded-xl text-xs font-bold flex items-center gap-2 btn-bounce">
                        <i class="fa-solid fa-bolt text-amber-400"></i>
                        <span id="diff-label">בינוני</span>
                    </button>
                </div>
                <div class="custom-glass px-4 py-2 rounded-2xl flex items-center gap-2 border-amber-400/30 border">
                    <span id="menu-coins" class="text-xl font-black text-amber-400">0</span>
                    <i class="fa-solid fa-coins text-amber-400"></i>
                </div>
            </div>

            <div class="text-center my-auto py-4">
                <span class="inline-block bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 text-xs font-black px-4 py-1.5 rounded-full mb-3 tracking-wide">
                    סימולטור הקפצות ריאליסטי
                </span>
                <h1 class="text-5xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-amber-300 drop-shadow-md">
                    מלך ההקפצות
                </h1>
                <p class="text-slate-400 text-sm mt-2 max-w-xs mx-auto">
                    שליטה בכדור, תחרויות וקירות צדדיים חכמים!
                </p>
            </div>

            <div class="flex flex-col gap-3 w-full max-w-md mx-auto mb-4">
                <button id="mode-solo-btn" class="w-full bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 p-4 rounded-2xl flex items-center justify-between shadow-lg shadow-emerald-950/40 border border-emerald-400/30 btn-bounce">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center text-xl">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <div class="text-right">
                            <div class="font-extrabold text-lg">שבירת שיא (סולו)</div>
                            <div class="text-xs text-emerald-100/70">הקפץ כמה שיותר בלי להפיל</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-left text-slate-300"></i>
                </button>

                <button id="mode-1v1-btn" class="w-full bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 p-4 rounded-2xl flex items-center justify-between shadow-lg shadow-indigo-950/40 border border-indigo-400/30 btn-bounce">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center text-xl">
                            <i class="fa-solid fa-user-ninja"></i>
                        </div>
                        <div class="text-right">
                            <div class="font-extrabold text-lg">תחרות 1 נגד 1</div>
                            <div class="text-xs text-indigo-100/70">דו-קרב מול בוט חכם</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-left text-slate-300"></i>
                </button>

                <button id="mode-tour-btn" class="w-full bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 p-4 rounded-2xl flex items-center justify-between shadow-lg shadow-amber-950/40 border border-amber-400/30 btn-bounce">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 bg-white/10 rounded-xl flex items-center justify-center text-xl">
                            <i class="fa-solid fa-trophy text-amber-200"></i>
                        </div>
                        <div class="text-right">
                            <div class="font-extrabold text-lg">טורניר אלופים</div>
                            <div class="text-xs text-amber-100/70">התחרה בשלבי נוקאאוט עד הגביע</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-left text-slate-300"></i>
                </button>
            </div>
        </div>

        <div id="gameover-overlay" class="absolute inset-0 z-30 flex items-center justify-center p-6 custom-glass hidden">
            <div class="bg-slate-900/90 border border-slate-700/60 p-6 rounded-3xl w-full max-w-sm text-center shadow-2xl">
                <div class="w-20 h-20 mx-auto rounded-full bg-red-500/20 text-red-500 flex items-center justify-center text-4xl mb-4 border border-red-500/40">
                    <i class="fa-solid fa-burst"></i>
                </div>

                <h2 class="text-3xl font-black text-white mb-1">הכדור נפל!</h2>
                <p class="text-slate-400 text-sm mb-6">נסה שוב ושבור את השיא</p>

                <div class="bg-slate-800/80 rounded-2xl p-4 mb-6 flex justify-around items-center border border-slate-700/40">
                    <div>
                        <div class="text-xs text-slate-400 font-bold mb-1">תוצאה</div>
                        <div id="go-score" class="text-3xl font-black text-emerald-400">0</div>
                    </div>
                    <div class="w-px h-10 bg-slate-700"></div>
                    <div>
                        <div class="text-xs text-slate-400 font-bold mb-1">שיא אישי</div>
                        <div id="go-best" class="text-3xl font-black text-amber-400">0</div>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button id="go-home-btn" class="w-1/3 bg-slate-800 hover:bg-slate-700 py-3 rounded-xl font-bold btn-bounce border border-slate-600">
                        <i class="fa-solid fa-house"></i>
                    </button>
                    <button id="go-restart-btn" class="w-2/3 bg-gradient-to-r from-emerald-500 to-teal-500 font-extrabold py-3 rounded-xl text-slate-950 btn-bounce shadow-lg shadow-emerald-950/50">
                        שחק שוב
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let state = {
            coins: parseInt(localStorage.getItem('jugg_coins') || '100'),
            bestScore: parseInt(localStorage.getItem('jugg_best') || '0'),
            mode: 'solo',
            score: 0,
            isPlaying: false,
            isPaused: false
        };

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const ball = {
            x: 0,
            y: 0,
            radius: 24,
            vx: 0,
            vy: 0,
            gravity: 0.4
        };

        const paddle = {
            x: 0,
            y: 0,
            width: 130,
            height: 22
        };

        const botPaddle = {
            x: 0,
            y: 100,
            width: 110,
            height: 20
        };

        function resetGame() {
            resizeCanvas();
            ball.x = canvas.width / 2;
            ball.y = canvas.height * 0.3;
            ball.vx = (Math.random() - 0.5) * 3;
            ball.vy = -1;

            paddle.width = Math.min(canvas.width * 0.35, 140);
            paddle.x = canvas.width / 2 - paddle.width / 2;
            paddle.y = canvas.height - 140;

            botPaddle.x = canvas.width / 2 - botPaddle.width / 2;

            state.score = 0;
            updateHUD();
        }

        function updateHUD() {
            document.getElementById('hud-score').innerText = state.score;
            document.getElementById('hud-coins').innerText = state.coins;
            document.getElementById('menu-coins').innerText = state.coins;
        }

        function setPaddlePos(clientX) {
            paddle.x = clientX - paddle.width / 2;
            if (paddle.x < 5) paddle.x = 5;
            if (paddle.x + paddle.width > canvas.width - 5) paddle.x = canvas.width - paddle.width - 5;
        }

        window.addEventListener('pointerdown', (e) => {
            if (!state.isPlaying || state.isPaused) return;
            setPaddlePos(e.clientX);
        });

        window.addEventListener('pointermove', (e) => {
            if (!state.isPlaying || state.isPaused) return;
            setPaddlePos(e.clientX);
        });

        function updatePhysics() {
            if (!state.isPlaying || state.isPaused) return;

            ball.vy += ball.gravity;
            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.vx *= -0.8;
            } else if (ball.x + ball.radius > canvas.width) {
                ball.x = canvas.width - ball.radius;
                ball.vx *= -0.8;
            }

            if (ball.vy > 0 && 
                ball.y + ball.radius >= paddle.y && 
                ball.y - ball.radius <= paddle.y + paddle.height &&
                ball.x + ball.radius >= paddle.x && 
                ball.x - ball.radius <= paddle.x + paddle.width) {
                
                ball.y = paddle.y - ball.radius;
                ball.vy = -Math.abs(ball.vy * 0.95) - 7;
                
                let hitOffset = (ball.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
                ball.vx += hitOffset * 5;

                state.score++;
                state.coins += 1;
                localStorage.setItem('jugg_coins', state.coins.toString());
                updateHUD();
            }

            if (state.mode === '1v1') {
                let targetX = ball.x - botPaddle.width / 2;
                botPaddle.x += (targetX - botPaddle.x) * 0.08;

                if (ball.vy < 0 && 
                    ball.y - ball.radius <= botPaddle.y + botPaddle.height &&
                    ball.x >= botPaddle.x && ball.x <= botPaddle.x + botPaddle.width) {
                    ball.vy = Math.abs(ball.vy) + 2;
                }
            }

            if (ball.y - ball.radius > canvas.height) {
                endGame();
            }
        }

        function render() {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 70, 0, Math.PI * 2);
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();

            if (state.isPlaying) {
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.strokeStyle = '#38bdf8';
                ctx.lineWidth = 4;
                ctx.stroke();

                ctx.fillStyle = '#10b981';
                ctx.beginPath();
                ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 12);
                ctx.fill();

                if (state.mode === '1v1') {
                    ctx.fillStyle = '#6366f1';
                    ctx.beginPath();
                    ctx.roundRect(botPaddle.x, botPaddle.y, botPaddle.width, botPaddle.height, 10);
                    ctx.fill();
                }

                updatePhysics();
            }

            requestAnimationFrame(render);
        }

        function startGame(mode) {
            state.mode = mode;
            state.isPlaying = true;
            state.isPaused = false;
            
            document.getElementById('menu-overlay').classList.add('hidden');
            document.getElementById('gameover-overlay').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');

            resetGame();
        }

        function endGame() {
            state.isPlaying = false;
            
            if (state.score > state.bestScore) {
                state.bestScore = state.score;
                localStorage.setItem('jugg_best', state.bestScore.toString());
            }

            document.getElementById('go-score').innerText = state.score;
            document.getElementById('go-best').innerText = state.bestScore;
            document.getElementById('gameover-overlay').classList.remove('hidden');
            document.getElementById('hud').classList.add('hidden');
        }

        document.getElementById('mode-solo-btn').addEventListener('click', () => startGame('solo'));
        document.getElementById('mode-1v1-btn').addEventListener('click', () => startGame('1v1'));
        document.getElementById('mode-tour-btn').addEventListener('click', () => startGame('solo'));

        document.getElementById('go-home-btn').addEventListener('click', () => {
            document.getElementById('gameover-overlay').classList.add('hidden');
            document.getElementById('menu-overlay').classList.remove('hidden');
            updateHUD();
        });

        document.getElementById('go-restart-btn').addEventListener('click', () => {
            startGame(state.mode);
        });

        document.getElementById('pause-btn').addEventListener('click', () => {
            state.isPaused = !state.isPaused;
        });

        updateHUD();
        requestAnimationFrame(render);
    </script>
</body>
</html>
