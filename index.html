        // --- Cleanup Old Service Workers & Cache + Setup Standalone PWA Manifest ---
        (async function initPWAAndCleanCache() {
            if ('serviceWorker' in navigator) {
                try {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (const reg of registrations) {
                        await reg.unregister();
                    }
                } catch (e) {}
            }
            if ('caches' in window) {
                try {
                    const keys = await caches.keys();
                    for (const key of keys) {
                        await caches.delete(key);
                    }
                } catch (e) {}
            }

            try {
                const iconCanvas = document.createElement('canvas');
                iconCanvas.width = 512;
                iconCanvas.height = 512;
                const ictx = iconCanvas.getContext('2d');
                ictx.fillStyle = '#0f172a';
                ictx.fillRect(0, 0, 512, 512);
                ictx.beginPath();
                ictx.arc(256, 256, 175, 0, Math.PI * 2);
                ictx.fillStyle = '#10b981';
                ictx.fill();
                ictx.beginPath();
                ictx.arc(256, 256, 135, 0, Math.PI * 2);
                ictx.fillStyle = '#ffffff';
                ictx.fill();
                ictx.fillStyle = '#0f172a';
                ictx.beginPath();
                ictx.arc(256, 256, 42, 0, Math.PI * 2);
                ictx.fill();

                const iconDataUrl = iconCanvas.toDataURL('image/png');
                const manifestObj = {
                    name: 'מלך ההקפצות - משחק כדורגל',
                    short_name: 'הקפצות',
                    start_url: './',
                    scope: './',
                    display: 'standalone',
                    background_color: '#0f172a',
                    theme_color: '#0f172a',
                    orientation: 'portrait',
                    icons: [
                        { src: iconDataUrl, sizes: '192x192', type: 'image/png', purpose: 'any maskable' },
                        { src: iconDataUrl, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
                    ]
                };
                const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/manifest+json' });
                const manifestUrl = URL.createObjectURL(blob);
                const linkEl = document.getElementById('dynamic-manifest');
                if (linkEl) linkEl.href = manifestUrl;
            } catch (e) {}
        })();

        // --- Firebase Realtime Leaderboard ---
        async function syncScoreToFirebase(newBestScore) {
            if (newBestScore <= 0) return;
            const displayName = playerName.trim() || (lang === 'he' ? 'שחקן אורח' : 'Guest Player');
            try {
                await fetch(`${FIREBASE_DB_URL}/leaderboard/${playerId}.json`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: displayName,
                        score: newBestScore,
                        updatedAt: Date.now()
                    })
                });
            } catch (e) {}
        }

        async function savePlayerName() {
            const input = document.getElementById('player-name-input');
            const cleanName = input.value.trim().replace(/[<>]/g, '');
            if (!cleanName) return;
            playerName = cleanName;
            localStorage.setItem('juggle_player_name', playerName);
            await syncScoreToFirebase(personalBest);
            loadLeaderboard();
        }

        async function loadLeaderboard() {
            const listEl = document.getElementById('leaderboard-list');
            document.getElementById('player-name-input').value = playerName;
            document.getElementById('lb-personal-best').innerText = personalBest;
            listEl.innerHTML = `<div class="text-center text-slate-400 py-8 text-sm animate-pulse">${lang === 'he' ? 'טוען שיאים מהענן...' : 'Loading scores...'}</div>`;

            try {
                const res = await fetch(`${FIREBASE_DB_URL}/leaderboard.json`);
                const data = await res.json();
                if (!data) {
                    listEl.innerHTML = `<div class="text-center text-slate-400 py-8 text-sm">${lang === 'he' ? 'עדיין אין שיאים. היה הראשון!' : 'No scores yet. Be the first!'}</div>`;
                    return;
                }

                const players = Object.keys(data).map(key => ({
                    id: key,
                    name: data[key].name || 'Player',
                    score: Number(data[key].score) || 0
                }));

                players.sort((a, b) => b.score - a.score);
                const top20 = players.slice(0, 20);

                listEl.innerHTML = '';
                top20.forEach((p, idx) => {
                    const rank = idx + 1;
                    const isMe = p.id === playerId;
                    let badge = `<span class="w-7 h-7 rounded-full bg-slate-700 text-slate-300 font-bold text-xs flex items-center justify-center">${rank}</span>`;
                    if (rank === 1) badge = `<span class="w-7 h-7 rounded-full bg-amber-500/20 text-amber-400 border border-amber-400/50 font-black text-sm flex items-center justify-center">👑</span>`;
                    else if (rank === 2) badge = `<span class="w-7 h-7 rounded-full bg-slate-300/20 text-slate-200 border border-slate-300/50 font-bold text-xs flex items-center justify-center">🥈</span>`;
                    else if (rank === 3) badge = `<span class="w-7 h-7 rounded-full bg-orange-600/20 text-orange-400 border border-orange-500/50 font-bold text-xs flex items-center justify-center">🥉</span>`;

        // --- Audio Engine ---
        let audioCtx = null;
        let isAudioEnabled = true;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!isAudioEnabled) return;
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'kick') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(200, now);
                    osc.frequency.exponentialRampToValueAtTime(50, now + 0.12);
                    gain.gain.setValueAtTime(0.6, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'firekick') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(90, now + 0.18);
                    gain.gain.setValueAtTime(0.7, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.18);
                    osc.start(now);
                    osc.stop(now + 0.18);
                } else if (type === 'powerup') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.2);
                    gain.gain.setValueAtTime(0.5, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'fail') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.3);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch (e) {}
        }

        function toggleAudio() {
            isAudioEnabled = !isAudioEnabled;
            const btn = document.getElementById('audio-toggle-btn');
            btn.innerHTML = isAudioEnabled ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-xmark text-red-400"></i>';
            if (!isAudioEnabled && bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            } else if (isAudioEnabled && activeSong !== 'none') {
                startBGM();
            }
        }

        function startBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            if (activeSong === 'none' || !isAudioEnabled) return;
            initAudio();
            let notes = activeSong === 'beat1' ? [220, 261, 330, 392] : [150, 200, 250, 300];
            let step = 0;
            bgmInterval = setInterval(() => {
                if (!isAudioEnabled || activeSong === 'none') return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = activeSong === 'beat1' ? 'sine' : 'square';
                    osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.2);
                    step++;
                } catch (e) {}
            }, 500);
        }

        // --- Canvas & Game Engine ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let gameMode = 'solo';
        let gameRunning = false;
        let score = 0;
        let particles = [];
        let floatingTexts = [];
        let animFrameId = null;

        let combo = 0;
        let isFireMode = false;

        let powerups = [];
        let powerupTimer = 0;
        let widePaddleEnd = 0;
        let slowMoEnd = 0;

        let ball = { x: 0, y: 0, vx: 0, vy: 0, radius: 20, rot: 0 };
        let player = { x: 0, y: 0, baseWidth: 90, width: 90, height: 26 };
        let bot = { x: 0, y: 0, width: 90, height: 26 };

        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = Math.max(300, Math.floor(rect.width));
            canvas.height = Math.max(360, Math.floor(rect.height));
        }

        window.addEventListener('resize', () => {
            if (gameRunning) resizeCanvas();
        });

        function startGame(mode) {
            if (animFrameId) cancelAnimationFrame(animFrameId);
            canvas.onclick = null;
            gameMode = mode;
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-container').classList.remove('hidden');
            resizeCanvas();
            resetPositions();
            gameRunning = true;
            score = 0;
            combo = 0;
            isFireMode = false;
            powerups = [];
            particles = [];
            floatingTexts = [];
            widePaddleEnd = 0;
            slowMoEnd = 0;
            powerupTimer = 0;
            player.width = player.baseWidth;
            document.getElementById('combo-badge').classList.add('hidden');
            document.getElementById('game-score-board').innerText = score;
            startBGM();
            animFrameId = requestAnimationFrame(gameLoop);
        }

        function returnToMenu() {
            gameRunning = false;
            canvas.onclick = null;
            if (animFrameId) cancelAnimationFrame(animFrameId);
            if (bgmInterval) clearInterval(bgmInterval);
            document.getElementById('game-container').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            updateUIStrings();
        }

        function resetPositions() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.vx = (Math.random() - 0.5) * 3;
            ball.vy = -6;
            ball.rot = 0;

            player.x = canvas.width / 2 - player.width / 2;
            player.y = canvas.height - 65;

            if (gameMode === 'pvp' || gameMode === 'tournament') {
                bot.x = canvas.width / 2 - bot.width / 2;
                bot.y = 35;
            }
        }

        function updatePaddleFromPointer(e) {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const touchX = e.clientX - rect.left;
            player.x = touchX - player.width / 2;
            player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
        }

        canvas.addEventListener('pointermove', updatePaddleFromPointer);
        canvas.addEventListener('pointerdown', updatePaddleFromPointer);

        function addFloatingText(text, x, y, color) {
            floatingTexts.push({ text, x, y, life: 1.0, color });
        }

        function spawnPowerup() {
            const types = [
                { type: 'wide', color: '#10b981', icon: '↔️' },
                { type: 'coin', color: '#fbbf24', icon: '🪙' },
                { type: 'slow', color: '#38bdf8', icon: '❄️' }
            ];
            const chosen = types[Math.floor(Math.random() * types.length)];
            powerups.push({
                x: Math.random() * (canvas.width - 60) + 30,
                y: Math.random() * (canvas.height * 0.45) + 100,
                radius: 18,
                type: chosen.type,
                color: chosen.color,
                icon: chosen.icon,
                pulse: 0
            });
        }

        function kickBall() {
            const paddleCenter = player.x + player.width / 2;
            const distFromCenter = Math.abs(ball.x - paddleCenter);
            const isSweetSpot = distFromCenter <= player.width * 0.28;

            if (isSweetSpot) {
                combo++;
                if (combo >= 5 && !isFireMode) {
                    isFireMode = true;
                    document.getElementById('combo-badge').classList.remove('hidden');
                    addFloatingText('🔥 FIRE MODE x2!', ball.x, ball.y - 35, '#f97316');
                } else if (combo > 1) {
                    addFloatingText(`COMBO x${combo}`, ball.x, ball.y - 25, '#fbbf24');
                }
            } else {
                combo = 0;
                isFireMode = false;
                document.getElementById('combo-badge').classList.add('hidden');
            }

            playSound(isFireMode ? 'firekick' : 'kick');
            if (navigator.vibrate) try { navigator.vibrate(isFireMode ? 80 : 45); } catch (e) {}

            const pCount = isFireMode ? 24 : 15;
            for (let i = 0; i < pCount; i++) {
                particles.push({
                    x: ball.x, y: ball.y,
                    vx: (Math.random() - 0.5) * (isFireMode ? 16 : 12),
                    vy: (Math.random() - 0.5) * (isFireMode ? 16 : 12),
                    life: 1.0,
                    color: isFireMode ? (Math.random() > 0.5 ? '#f97316' : '#ef4444') :
                        (activeSkin === 'gold' ? '#fbbf24' : activeSkin === 'neon' ? '#38bdf8' : activeSkin === 'fire' ? '#f97316' : '#ffffff')
                });
            }

            let angle = (Math.random() - 0.5) * 1.4;
            ball.vy = isFireMode ? -24 : -22;
            ball.vx += angle * 7;

            const pointsEarned = isFireMode ? 2 : 1;
            score += pointsEarned;
            document.getElementById('game-score-board').innerText = score;

            checkAchievements();
        }

        function checkAchievements() {
            if (score >= 50 && achievements.juggles_50.progress < 50) {
                achievements.juggles_50.progress = 50;
            }
            if (score >= 100 && achievements.score_100.progress < 100) {
                achievements.score_100.progress = 100;
            }
            saveGameData();
        }

        function gameLoop() {
            if (!gameRunning) return;
            const now = Date.now();

            player.width = (now < widePaddleEnd) ? player.baseWidth * 1.5 : player.baseWidth;
            const timeScale = (now < slowMoEnd) ? 0.65 : 1.0;

            powerupTimer++;
            if (powerupTimer > 420 && powerups.length < 2) {
                spawnPowerup();
                powerupTimer = 0;
            }

            ball.vy += 0.42 * timeScale;
            ball.x += ball.vx * timeScale;
            ball.y += ball.vy * timeScale;
            ball.vx *= 0.99;
            ball.rot += ball.vx * 0.05;

            if (isFireMode) {
                particles.push({
                    x: ball.x + (Math.random() - 0.5) * 12,
                    y: ball.y + (Math.random() - 0.5) * 12,
                    vx: (Math.random() - 0.5) * 2,
                    vy: (Math.random() - 0.5) * 2,
                    life: 0.7,
                    color: Math.random() > 0.4 ? '#f97316' : '#fbbf24'
                });
            }

            if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.vx *= -0.85; }
            if (ball.x + ball.radius > canvas.width) { ball.x = canvas.width - ball.radius; ball.vx *= -0.85; }

            for (let i = powerups.length - 1; i >= 0; i--) {
                const pw = powerups[i];
                pw.pulse += 0.08;
                const dx = ball.x - pw.x;
                const dy = ball.y - pw.y;
                if (Math.hypot(dx, dy) < ball.radius + pw.radius) {
                    playSound('powerup');
                    if (pw.type === 'wide') {
                        widePaddleEnd = now + 8000;
                        addFloatingText('↔️ מחבט ענק!', pw.x, pw.y, '#10b981');
                    } else if (pw.type === 'coin') {
                        coins += 5;
                        saveGameData();
                        addFloatingText('+5 🪙', pw.x, pw.y, '#fbbf24');
                    } else if (pw.type === 'slow') {
                        slowMoEnd = now + 6000;
                        addFloatingText('❄️ הילוך איטי!', pw.x, pw.y, '#38bdf8');
                    }
                    powerups.splice(i, 1);
                }
            }

            if (ball.y + ball.radius >= player.y && ball.y - ball.radius <= player.y + player.height &&
                ball.x >= player.x - 20 && ball.x <= player.x + player.width + 20 && ball.vy > 0) {
                kickBall();
            }

            if (gameMode === 'pvp' || gameMode === 'tournament') {
                bot.y = 35;
                let trackSpeed = difficulty === 'hard' ? 0.32 : difficulty === 'medium' ? 0.22 : 0.14;
                bot.x += (ball.x - (bot.x + bot.width / 2)) * trackSpeed;
                bot.x = Math.max(0, Math.min(canvas.width - bot.width, bot.x));

                if (ball.y - ball.radius <= bot.y + bot.height + 20 && ball.vy < 0) {
                    playSound('kick');
                    if (navigator.vibrate) try { navigator.vibrate(50); } catch (e) {}

                    for (let i = 0; i < 15; i++) {
                        particles.push({
                            x: ball.x, y: ball.y,
                            vx: (Math.random() - 0.5) * 12,
                            vy: (Math.random() - 0.5) * 12,
                            life: 1.0,
                            color: '#6366f1'
                        });
                    }

                    let botAngle = (Math.random() - 0.5) * 1.4;
                    ball.vy = 22;
                    ball.vx += botAngle * 7;
                }
            }

            if (ball.y > canvas.height + 40) {
                playSound('fail');
                gameRunning = false;
                if (bgmInterval) clearInterval(bgmInterval);
                showGameOverScreen();
                return;
            }

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();

            powerups.forEach(pw => {
                ctx.save();
                ctx.beginPath();
                ctx.arc(pw.x, pw.y, pw.radius + Math.sin(pw.pulse) * 3, 0, Math.PI * 2);
                ctx.fillStyle = pw.color + '33';
                ctx.fill();
                ctx.lineWidth = 2;
                ctx.strokeStyle = pw.color;
                ctx.stroke();

                ctx.font = '18px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(pw.icon, pw.x, pw.y);
                ctx.restore();
            });

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.035;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                } else {
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = p.life;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, isFireMode ? 5 : 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.globalAlpha = 1.0;
                }
            }

            ctx.fillStyle = (now < widePaddleEnd) ? '#34d399' : '#10b981';
            ctx.shadowColor = '#10b981';
            ctx.shadowBlur = 12;
            ctx.beginPath();
            ctx.roundRect(player.x, player.y, player.width, player.height, 12);
            ctx.fill();
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#fbbf24';
            ctx.beginPath();
            ctx.roundRect(player.x + player.width * 0.35, player.y + 3, player.width * 0.3, 4, 2);
            ctx.fill();

            if (gameMode === 'pvp' || gameMode === 'tournament') {
                ctx.fillStyle = '#6366f1';
                ctx.shadowColor = '#6366f1';
                ctx.shadowBlur = 12;
                ctx.beginPath();
                ctx.roundRect(bot.x, bot.y, bot.width, bot.height, 12);
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            ctx.save();
            ctx.translate(ball.x, ball.y);
            ctx.rotate(ball.rot);
            let skinObj = skinsData.find(s => s.id === activeSkin) || skinsData[0];
            ctx.fillStyle = isFireMode ? '#f97316' : skinObj.color;
            ctx.shadowColor = isFireMode ? '#ef4444' : skinObj.color;
            ctx.shadowBlur = isFireMode ? 26 : 18;
            ctx.beginPath();
            ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.restore();

            for (let i = floatingTexts.length - 1; i >= 0; i--) {
                let ft = floatingTexts[i];
                ft.y -= 1.2;
                ft.life -= 0.02;
                if (ft.life <= 0) {
                    floatingTexts.splice(i, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = ft.life;
                    ctx.fillStyle = ft.color;
                    ctx.font = 'bold 16px Rubik, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText(ft.text, ft.x, ft.y);
                    ctx.restore();
                }
            }

            animFrameId = requestAnimationFrame(gameLoop);
        }

        function showGameOverScreen() {
            const t = translations[lang];
            let isNewRecord = false;
            if (score > personalBest) {
                personalBest = score;
                isNewRecord = true;
                saveGameData();
                if (!playerName) {
                    setTimeout(() => {
                        const entered = prompt(lang === 'he' ? 'שברת שיא חדש! הכנס את שמך לטבלת המובילים:' : 'New Record! Enter your name for the Leaderboard:');
                        if (entered && entered.trim()) {
                            playerName = entered.trim().replace(/[<>]/g, '');
                            localStorage.setItem('juggle_player_name', playerName);
                        }
                        syncScoreToFirebase(personalBest);
                    }, 300);
                } else {
                    syncScoreToFirebase(personalBest);
                }
            }

            ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 28px Rubik, sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(t.gameOver, canvas.width / 2, canvas.height / 2 - 55);

            ctx.fillStyle = '#34d399';
            ctx.font = 'bold 22px Rubik, sans-serif';
            ctx.fillText(`${t.scoreTxt}: ${score}`, canvas.width / 2, canvas.height / 2 - 15);

            ctx.fillStyle = isNewRecord ? '#fbbf24' : '#94a3b8';
            ctx.font = 'bold 15px Rubik, sans-serif';
            ctx.fillText(isNewRecord ? `🏆 ${t.bestTxt}: ${personalBest}` : `${t.bestTxt}: ${personalBest}`, canvas.width / 2, canvas.height / 2 + 15);

            let earnedCoins = Math.floor(score / 4);
            if (earnedCoins > 0) {
                coins += earnedCoins;
                saveGameData();
                ctx.fillStyle = '#fbbf24';
                ctx.font = '15px Rubik, sans-serif';
                ctx.fillText(`+${earnedCoins} 🪙`, canvas.width / 2, canvas.height / 2 + 42);
            }

            ctx.fillStyle = '#10b981';
            ctx.beginPath();
            ctx.roundRect(canvas.width / 2 - 90, canvas.height / 2 + 65, 180, 45, 12);
            ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 16px Rubik, sans-serif';
            ctx.fillText(t.retry, canvas.width / 2, canvas.height / 2 + 93);

            canvas.onclick = function() {
                canvas.onclick = null;
                startGame(gameMode);
            };
        }

        // --- Shop & Achievements Modals ---
        function openShopModal() {
            renderShop('skins');
            document.getElementById('shop-modal').classList.remove('hidden');
        }
        function closeShopModal() {
            document.getElementById('shop-modal').classList.add('hidden');
        }

        function switchShopTab(tab) {
            const skinBtn = document.getElementById('tab-skins-btn');
            const songBtn = document.getElementById('tab-songs-btn');
            if (tab === 'skins') {
                skinBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-emerald-600 text-white transition cursor-pointer';
                songBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition cursor-pointer';
                renderShop('skins');
            } else {
                songBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg bg-emerald-600 text-white transition cursor-pointer';
                skinBtn.className = 'flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 hover:text-white transition cursor-pointer';
                renderShop('songs');
            }
        }

        function renderShop(type) {
            const container = document.getElementById('shop-items-container');
            container.innerHTML = '';
            const t = translations[lang];

            if (type === 'skins') {
                skinsData.forEach(item => {
                    let isOwned = unlockedSkins.includes(item.id);
                    let isEquipped = activeSkin === item.id;
                    container.innerHTML += `
                        <div class="bg-slate-800/80 border border-slate-700/80 p-3 rounded-2xl flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl flex items-center justify-center border border-slate-600" style="background:${item.color}"></div>
                                <div>
                                    <div class="font-bold text-sm">${item.name[lang] || item.name.en}</div>
                                    <div class="text-xs text-amber-400 flex items-center gap-1"><i class="fa-solid fa-coins"></i> ${item.price}</div>
                                </div>
                            </div>
                            <div>
                                ${isEquipped ? `<span class="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-xl font-bold">${t.equipped}</span>` :
                                    isOwned ? `<button type="button" onclick="equipSkin('${item.id}')" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-1.5 rounded-xl font-bold transition cursor-pointer">${t.equip}</button>` :
                                    `<button type="button" onclick="buySkin('${item.id}', ${item.price})" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs px-4 py-1.5 rounded-xl font-bold transition cursor-pointer">${t.buy}</button>`}
                            </div>
                        </div>
                    `;
                });
            } else {
                songsData.forEach(item => {
                    let isOwned = unlockedSongs.includes(item.id);
                    let isEquipped = activeSong === item.id;
                    container.innerHTML += `
                        <div class="bg-slate-800/80 border border-slate-700/80 p-3 rounded-2xl flex items-center justify-between">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-slate-700 rounded-xl flex items-center justify-center text-cyan-400"><i class="fa-solid fa-music"></i></div>
                                <div>
                                    <div class="font-bold text-sm">${item.name[lang] || item.name.en}</div>
                                    <div class="text-xs text-amber-400 flex items-center gap-1"><i class="fa-solid fa-coins"></i> ${item.price}</div>
                                </div>
                            </div>
                            <div>
                                ${isEquipped ? `<span class="text-xs bg-emerald-500/20 text-emerald-400 px-3 py-1.5 rounded-xl font-bold">${t.equipped}</span>` :
                                    isOwned ? `<button type="button" onclick="equipSong('${item.id}')" class="bg-slate-700 hover:bg-slate-600 text-white text-xs px-3 py-1.5 rounded-xl font-bold transition cursor-pointer">${t.equip}</button>` :
                                    `<button type="button" onclick="buySong('${item.id}', ${item.price})" class="bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs px-4 py-1.5 rounded-xl font-bold transition cursor-pointer">${t.buy}</button>`}
                            </div>
                        </div>
                    `;
                });
            }
        }

        function buySkin(id, price) {
            if (coins >= price) {
                coins -= price;
                unlockedSkins.push(id);
                activeSkin = id;
                saveGameData();
                renderShop('skins');
            } else {
                alert(lang === 'he' ? 'אין לך מספיק מטבעות!' : 'Not enough coins!');
            }
        }

        function equipSkin(id) {
            activeSkin = id;
            saveGameData();
            renderShop('skins');
        }

        function buySong(id, price) {
            if (coins >= price) {
                coins -= price;
                unlockedSongs.push(id);
                activeSong = id;
                saveGameData();
                renderShop('songs');
                startBGM();
            } else {
                alert(lang === 'he' ? 'אין לך מספיק מטבעות!' : 'Not enough coins!');
            }
        }

        function equipSong(id) {
            activeSong = id;
            saveGameData();
            renderShop('songs');
            startBGM();
        }

        function openAchievementsModal() {
            renderAchievements();
            document.getElementById('achievements-modal').classList.remove('hidden');
        }
        function closeAchievementsModal() {
            document.getElementById('achievements-modal').classList.add('hidden');
        }

        function renderAchievements() {
            const container = document.getElementById('achievements-container');
            container.innerHTML = '';
            const t = translations[lang];

            const achieveList = [
                { id: 'juggles_50', title: { he: 'שולט בכדור (50 הקפצות)', en: 'Ball Master (50 juggles)', ru: 'Мастер (50)', fr: 'Maître (50)' } },
                { id: 'shop_2', title: { he: 'אספן עשיר (קנה 2 פריטים)', en: 'Rich Collector (Buy 2 items)', ru: 'Коллекционер', fr: 'Collectionneur' } },
                { id: 'score_100', title: { he: 'אגדת הקפצות (100 נקודות)', en: 'Legend (100 score)', ru: 'Легенда (100)', fr: 'Légende (100)' } }
            ];

            achieveList.forEach(item => {
                let data = achievements[item.id];
                let isCompleted = data.progress >= data.target;
                container.innerHTML += `
                    <div class="bg-slate-800/80 border border-slate-700/80 p-4 rounded-2xl flex flex-col gap-2">
                        <div class="flex justify-between items-center">
                            <div class="font-bold text-sm">${item.title[lang] || item.title.en}</div>
                            <div class="text-xs text-amber-400 font-bold flex items-center gap-1"><i class="fa-solid fa-coins"></i> +${data.reward}</div>
                        </div>
                        <div class="w-full bg-slate-700 h-2 rounded-full overflow-hidden">
                            <div class="bg-emerald-500 h-full transition-all duration-300" style="width: ${Math.min(100, (data.progress / data.target) * 100)}%"></div>
                        </div>
                        <div class="flex justify-between items-center text-xs text-slate-400">
                            <span>${data.progress} / ${data.target}</span>
                            ${data.claimed ? `<span class="text-emerald-400 font-bold">${t.claimed}</span>` :
                                isCompleted ? `<button type="button" onclick="claimAchievement('${item.id}')" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-3 py-1 rounded-xl transition cursor-pointer">${t.claim}</button>` :
                                `<span class="text-slate-500">בתהליך</span>`}
                        </div>
                    </div>
                `;
            });
        }

        function claimAchievement(id) {
            if (!achievements[id].claimed && achievements[id].progress >= achievements[id].target) {
                achievements[id].claimed = true;
                coins += achievements[id].reward;
                saveGameData();
                renderAchievements();
            }
        }

        updateUIStrings();
    </script>
</body>
</html>
