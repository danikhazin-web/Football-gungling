<!DOCTYPE html>
<html lang="he" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="page-title">מלך ההקפצות - משחק כדורגל</title>
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="הקפצות">
    <meta name="theme-color" content="#0f172a">
    <link rel="manifest" href="manifest.json">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Rubik', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }
        .canvas-container {
            touch-action: none;
        }
        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .modal-animate {
            animation: popUp 0.25s ease-out forwards;
        }
    </style>
</head>
<body class="flex flex-col h-full justify-between">

    <!-- Header / Top Bar -->
    <header class="flex justify-between items-center p-4 bg-slate-900/80 backdrop-blur border-b border-slate-800 z-10">
        <div class="flex items-center gap-2 bg-slate-800/90 px-3 py-1.5 rounded-full border border-slate-700 shadow-inner">
            <i class="fa-solid fa-coins text-yellow-400 text-lg"></i>
            <span id="coins-display" class="font-extrabold text-yellow-400 text-lg">75</span>
        </div>
        
        <div class="flex items-center gap-2">
            <!-- Difficulty Selector -->
            <button id="difficulty-btn" onclick="toggleDifficulty()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-full border border-slate-700 text-xs font-semibold text-amber-400 transition">
                <i class="fa-solid fa-bolt"></i>
                <span id="diff-text">בינוני</span>
            </button>
            
            <!-- Language Selector -->
            <button onclick="toggleLanguage()" class="flex items-center gap-1.5 bg-slate-800 hover:bg-slate-700 px-3 py-1.5 rounded-full border border-slate-700 text-xs font-semibold text-slate-300 transition">
                <i class="fa-solid fa-globe text-cyan-400"></i>
                <span id="lang-text">עברית</span>
            </button>
        </div>
    </header>

    <!-- Main Screen / Menu -->
    <main id="main-menu" class="flex-1 flex flex-col justify-center items-center p-6 text-center max-w-md mx-auto w-full z-10">
        <div class="mb-6">
            <span id="badge-subtitle" class="bg-cyan-500/10 text-cyan-400 border border-cyan-500/20 text-xs font-semibold px-3 py-1.5 rounded-full uppercase tracking-wider">
                סימולטור הקפצות ריאליסטי
            </span>
            <h1 id="main-title" class="text-4xl font-black mt-3 bg-gradient-to-r from-cyan-400 to-indigo-500 bg-clip-text text-transparent">
                מלך ההקפצות
            </h1>
            <p id="main-desc" class="text-slate-400 text-sm mt-1">שליטה בכדור, תחרויות ומוזיקה ברקע!</p>
        </div>

        <div class="w-full space-y-3">
            <button onclick="startGame('solo')" class="w-full flex items-center justify-between p-4 bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 rounded-2xl shadow-lg shadow-teal-900/30 transition transform active:scale-95 border border-teal-400/20">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-xl text-white">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <div class="text-right">
                        <h3 id="btn-solo-title" class="font-bold text-white text-base">שבירת שיא (סולו)</h3>
                        <p id="btn-solo-desc" class="text-xs text-teal-100">הקפץ כמה שיותר בלי להפיל</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left text-white/70"></i>
            </button>

            <button onclick="startGame('pvp')" class="w-full flex items-center justify-between p-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 rounded-2xl shadow-lg shadow-indigo-900/30 transition transform active:scale-95 border border-indigo-400/20">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-xl text-white">
                        <i class="fa-solid fa-robot"></i>
                    </div>
                    <div class="text-right">
                        <h3 id="btn-pvp-title" class="font-bold text-white text-base">תחרות 1 נגד 1</h3>
                        <p id="btn-pvp-desc" class="text-xs text-blue-100">דו-קרב מול בוט חכם</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left text-white/70"></i>
            </button>

            <button onclick="startGame('tournament')" class="w-full flex items-center justify-between p-4 bg-gradient-to-r from-amber-600 to-orange-600 hover:from-amber-500 hover:to-orange-500 rounded-2xl shadow-lg shadow-orange-900/30 transition transform active:scale-95 border border-orange-400/20">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-white/10 flex items-center justify-center text-xl text-white">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <div class="text-right">
                        <h3 id="btn-tourn-title" class="font-bold text-white text-base">טורניר אלופים</h3>
                        <p id="btn-tourn-desc" class="text-xs text-amber-100">שלבי נוקאאוט עד הגביע הגדול</p>
                    </div>
                </div>
                <i class="fa-solid fa-chevron-left text-white/70"></i>
            </button>
        </div>
    </main>

    <!-- Game Arena (Canvas Screen) -->
    <div id="game-screen" class="hidden flex-1 relative canvas-container flex flex-col items-center justify-center overflow-hidden">
        <!-- HUD Over Canvas -->
        <div class="absolute top-4 inset-x-4 flex justify-between items-center z-10 px-2 pointer-events-none">
            <button onclick="returnToMenu()" class="pointer-events-auto bg-slate-800/80 hover:bg-slate-700 text-white w-10 h-10 rounded-full flex items-center justify-center border border-slate-700 shadow transition">
                <i class="fa-solid fa-house"></i>
            </button>
            <div class="bg-slate-900/80 backdrop-blur px-5 py-2 rounded-2xl border border-slate-800 text-center shadow-lg">
                <span id="score-label" class="text-xs text-slate-400 block">הקפצות</span>
                <span id="current-score" class="text-2xl font-black text-cyan-400">0</span>
            </div>
            <div class="w-10"></div>
        </div>

        <canvas id="gameCanvas" class="w-full h-full block bg-slate-950"></canvas>
    </div>

    <!-- Bottom Navigation Bar -->
    <nav class="flex justify-around items-center p-3 bg-slate-900/90 backdrop-blur border-t border-slate-800 z-10 max-w-md mx-auto w-full">
        <button onclick="openModal('achievements-modal')" class="flex flex-col items-center gap-1 text-slate-400 hover:text-cyan-400 transition">
            <i class="fa-solid fa-medal text-lg"></i>
            <span id="nav-achievements" class="text-[10px] font-medium">הישגים</span>
        </button>
        <button onclick="openModal('shop-modal')" class="flex flex-col items-center gap-1 text-slate-400 hover:text-yellow-400 transition">
            <i class="fa-solid fa-store text-lg"></i>
            <span id="nav-shop" class="text-[10px] font-medium">חנות</span>
        </button>
    </nav>

    <!-- Shop Modal -->
    <div id="shop-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-6 modal-animate shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-4">
                <h2 id="shop-title" class="text-xl font-black text-white flex items-center gap-2">
                    <i class="fa-solid fa-store text-yellow-400"></i> חנות פריטים
                </h2>
                <button onclick="closeModal('shop-modal')" class="text-slate-400 hover:text-white p-2">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <!-- Tabs -->
            <div class="flex gap-2 mb-4 bg-slate-950 p-1 rounded-xl">
                <button onclick="switchShopTab('skins')" id="tab-skins-btn" class="flex-1 py-2 text-xs font-bold rounded-lg bg-cyan-500 text-white transition">סקינים</button>
                <button onclick="switchShopTab('songs')" id="tab-songs-btn" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 transition">מוזיקה</button>
            </div>
            <!-- Tab Content -->
            <div id="shop-content-area" class="overflow-y-auto flex-1 space-y-3 pr-1">
                <!-- Dynamically populated via JS -->
            </div>
        </div>
    </div>

    <!-- Achievements Modal -->
    <div id="achievements-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm hidden z-50 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-3xl p-6 modal-animate shadow-2xl flex flex-col max-h-[85vh]">
            <div class="flex justify-between items-center mb-4">
                <h2 id="ach-title" class="text-xl font-black text-white flex items-center gap-2">
                    <i class="fa-solid fa-medal text-cyan-400"></i> הישגים ואתגרים
                </h2>
                <button onclick="closeModal('achievements-modal')" class="text-slate-400 hover:text-white p-2">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="achievements-list" class="overflow-y-auto flex-1 space-y-3 pr-1">
                <!-- Dynamically populated via JS -->
            </div>
        </div>
    </div>

    <script>
        // --- TRANSLATIONS ---
        const translations = {
            he: {
                title: "מלך ההקפצות - משחק כדורגל",
                subtitle: "סימולטור הקפצות ריאליסטי",
                mainTitle: "מלך ההקפצות",
                mainDesc: "שליטה בכדור, תחרויות ומוזיקה ברקע!",
                soloTitle: "שבירת שיא (סולו)",
                soloDesc: "הקפץ כמה שיותר בלי להפיל",
                pvpTitle: "תחרות 1 נגד 1",
                pvpDesc: "דו-קרב מול בוט חכם",
                tournTitle: "טורניר אלופים",
                tournDesc: "שלבי נוקאאוט עד הגביע הגדול",
                achievements: "הישגים",
                shop: "חנות",
                score: "הקפצות",
                diffs: ["קל", "בינוני", "קשה"],
                skinsTab: "סקינים",
                songsTab: "מוזיקה"
            },
            en: {
                title: "Juggling King - Soccer Game",
                subtitle: "Realistic Juggling Simulator",
                mainTitle: "Juggling King",
                mainDesc: "Ball control, tournaments & background music!",
                soloTitle: "Solo Record",
                soloDesc: "Keep the ball up as long as you can",
                pvpTitle: "1v1 Match",
                pvpDesc: "Duel against a smart bot",
                tournTitle: "Champions Tournament",
                tournDesc: "Knockout stages to the big cup",
                achievements: "Achievements",
                shop: "Shop",
                score: "Juggles",
                diffs: ["Easy", "Medium", "Hard"],
                skinsTab: "Skins",
                songsTab: "Music"
            },
            ru: {
                title: "Король Жонглирования - Футбол",
                subtitle: "Реалистичный симулятор",
                mainTitle: "Жонглер",
                mainDesc: "Контроль мяча, турниры и музыка!",
                soloTitle: "Соло рекорд",
                soloDesc: "Жонглируйте как можно дольше",
                pvpTitle: "Матч 1 на 1",
                pvpDesc: "Дуэль против умного бота",
                tournTitle: "Турнир чемпионов",
                tournDesc: "Плей-офф до главного кубка",
                achievements: "Достижения",
                shop: "Магазин",
                score: "Удары",
                diffs: ["Легко", "Средне", "Сложно"],
                skinsTab: "Скины",
                songsTab: "Музыка"
            },
            fr: {
                title: "Roi du JG - Jeu de Foot",
                subtitle: "Simulateur de JEL",
                mainTitle: "Roi du Juggling",
                mainDesc: "Contrôle du ballon, tournois et musique !",
                soloTitle: "Record Solo",
                soloDesc: "Gardez le ballon en l'air",
                pvpTitle: "Match 1v1",
                pvpDesc: "Duel contre un bot intelligent",
                tournTitle: "Tournoi des Champions",
                tournDesc: "Phase éliminatoire pour la coupe",
                achievements: "Succès",
                shop: "Boutique",
                score: "Jongles",
                diffs: ["Facile", "Moyen", "Difficile"],
                skinsTab: "Skins",
                songsTab: "Musique"
            }
        };

        let currentLangIdx = 0;
        const langs = ['he', 'en', 'ru', 'fr'];
        let currentDiff = 1; // 0: Easy, 1: Med, 2: Hard

        function toggleLanguage() {
            currentLangIdx = (currentLangIdx + 1) % langs.length;
            const l = langs[currentLangIdx];
            document.getElementById('html-root').setAttribute('lang', l);
            document.getElementById('html-root').setAttribute('dir', l === 'he' ? 'rtl' : 'ltr');
            
            const t = translations[l];
            document.getElementById('page-title').innerText = t.title;
            document.getElementById('badge-subtitle').innerText = t.subtitle;
            document.getElementById('main-title').innerText = t.mainTitle;
            document.getElementById('main-desc').innerText = t.mainDesc;
            document.getElementById('btn-solo-title').innerText = t.soloTitle;
            document.getElementById('btn-solo-desc').innerText = t.soloDesc;
            document.getElementById('btn-pvp-title').innerText = t.pvpTitle;
            document.getElementById('btn-pvp-desc').innerText = t.pvpDesc;
            document.getElementById('btn-tourn-title').innerText = t.tournTitle;
            document.getElementById('btn-tourn-desc').innerText = t.tournDesc;
            document.getElementById('nav-achievements').innerText = t.achievements;
            document.getElementById('nav-shop').innerText = t.shop;
            document.getElementById('score-label').innerText = t.score;
            document.getElementById('lang-text').innerText = l.toUpperCase();
            document.getElementById('diff-text').innerText = t.diffs[currentDiff];
        }

        function toggleDifficulty() {
            currentDiff = (currentDiff + 1) % 3;
            const l = langs[currentLangIdx];
            document.getElementById('diff-text').innerText = translations[l].diffs[currentDiff];
        }

        // --- GAME STATE & STORAGE ---
        let gameState = {
            coins: parseInt(localStorage.getItem('jj_coins') || '75'),
            unlockedSkins: JSON.parse(localStorage.getItem('jj_skins') || '["classic"]'),
            currentSkin: localStorage.getItem('jj_curr_skin') || 'classic',
            unlockedSongs: JSON.parse(localStorage.getItem('jj_songs') || '["none"]'),
            currentSong: localStorage.getItem('jj_curr_song') || 'none',
            achievements: JSON.parse(localStorage.getItem('jj_achs') || '{"score50":false, "score100":false, "rich":false}')
        };

        function saveGame() {
            localStorage.setItem('jj_coins', gameState.coins);
            localStorage.setItem('jj_skins', JSON.stringify(gameState.unlockedSkins));
            localStorage.setItem('jj_curr_skin', gameState.currentSkin);
            localStorage.setItem('jj_songs', JSON.stringify(gameState.unlockedSongs));
            localStorage.setItem('jj_curr_song', gameState.currentSong);
            localStorage.setItem('jj_achs', JSON.stringify(gameState.achievements));
            document.getElementById('coins-display').innerText = gameState.coins;
        }

        // --- SHOP & ACHIEVEMENTS DATA ---
        const skinsList = [
            id: 'classic', name: 'کלאסיק לבן-שחור', price: 0, color: '#ffffff', pattern: '#000000' },
            { id: 'gold', name: 'כדור זהב יוקרתי', price: 100, color: '#f59e0b', pattern: '#d97706' },
            { id: 'neon', name: 'ניאון סייבר', price: 200, color: '#06b6d4', pattern: '#3b82f6' },
            { id: 'fire', name: 'להבת האש', price: 350, color: '#ef4444', pattern: '#b91c1c' }
        ];

        const songsList = [
            { id: 'none', name: 'ללא מוזיקה', price: 0 },
            { id: 'beat1', name: 'קצב רחוב (Beat)', price: 50 },
            { id: 'synth', name: 'אלקטרו סינת\'', price: 120 }
        ];

        const achievementsList = [
            { id: 'score50', title: 'שולט בכדור', desc: 'הגע ל-50 הקפצות ברצף', reward: 30, check: (s) => s.maxScore >= 50 },
            { id: 'score100', title: 'אמן ההקפצות', desc: 'הגע ל-100 הקפצות ברצף', reward: 70, check: (s) => s.maxScore >= 100 },
            { id: 'rich', title: 'אספן עשיר', desc: 'פתח לפחות סקין אחד בחנות', reward: 40, check: () => gameState.unlockedSkins.length > 1 }
        ];

        let maxScore = parseInt(localStorage.getItem('jj_max_score') || '0');

        function openModal(id) {
            document.getElementById(id).classList.remove('hidden');
            if (id === 'shop-modal') renderShop('skins');
            if (id === 'achievements-modal') renderAchievements();
        }

        function closeModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        function switchShopTab(tab) {
            const skinsBtn = document.getElementById('tab-skins-btn');
            const songsBtn = document.getElementById('tab-songs-btn');
            if(tab === 'skins') {
                skinsBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-cyan-500 text-white transition";
                songsBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 transition";
                renderShop('skins');
            } else {
                songsBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-cyan-500 text-white transition";
                skinsBtn.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-400 transition";
                renderShop('songs');
            }
        }

        function renderShop(type) {
            const container = document.getElementById('shop-content-area');
            container.innerHTML = '';
            const items = type === 'skins' ? skinsList : songsList;

            items.forEach(item => {
                const unlocked = type === 'skins' ? gameState.unlockedSkins.includes(item.id) : gameState.unlockedSongs.includes(item.id);
                const selected = type === 'skins' ? gameState.currentSkin === item.id : gameState.currentSong === item.id;

                let btnHtml = '';
                if (selected) {
                    btnHtml = `<span class="text-xs font-bold text-cyan-400 bg-cyan-500/10 px-3 py-1.5 rounded-xl border border-cyan-500/30">בשימוש</span>`;
                } else if (unlocked) {
                    btnHtml = `<button onclick="selectItem('${type}', '${item.id}')" class="bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-700 transition">בחר</button>`;
                } else {
                    btnHtml = `<button onclick="buyItem('${type}', '${item.id}', ${item.price})" class="bg-yellow-500/20 hover:bg-yellow-500/30 text-yellow-400 text-xs font-bold px-3 py-1.5 rounded-xl border border-yellow-500/30 flex items-center gap-1 transition"><i class="fa-solid fa-coins"></i> ${item.price}</button>`;
                }

                container.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-950/60 p-3 rounded-2xl border border-slate-800/80">
                        <div class="flex items-center gap-3">
                            <div class="w-10 h-10 rounded-xl bg-slate-800 flex items-center justify-center font-bold text-cyan-400">
                                <i class="fa-solid ${type === 'skins' ? 'fa-futbol' : 'fa-music'}"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-sm text-white">${item.name}</h4>
                            </div>
                        </div>
                        ${btnHtml}
                    </div>
                `;
            });
        }

        function buyItem(type, id, price) {
            if (gameState.coins >= price) {
                gameState.coins -= price;
                if (type === 'skins') gameState.unlockedSkins.push(id);
                else gameState.unlockedSongs.push(id);
                saveGame();
                renderShop(type);
                checkAchievements();
            } else {
                alert("אין מספיק מטבעות!");
            }
        }

        function selectItem(type, id) {
            if (type === 'skins') gameState.currentSkin = id;
            else gameState.currentSong = id;
            saveGame();
            renderShop(type);
        }

        function renderAchievements() {
            const container = document.getElementById('achievements-list');
            container.innerHTML = '';

            achievementsList.forEach(ach => {
                const isCompleted = gameState.achievements[ach.id];
                const canClaim = !isCompleted && ach.check({ maxScore });

                let actionBtn = '';
                if (isCompleted) {
                    actionBtn = `<span class="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full border border-emerald-500/20">הושלם ✓</span>`;
                } else if (canClaim) {
                    actionBtn = `<button onclick="claimAchievement('${ach.id}', ${ach.reward})" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded-xl shadow transition">אסוף פרס (${ach.reward})</button>`;
                } else {
                    actionBtn = `<span class="text-xs text-slate-500">+${ach.reward} מטבעות</span>`;
                }

                container.innerHTML += `
                    <div class="flex items-center justify-between bg-slate-950/60 p-3 rounded-2xl border border-slate-800/80">
                        <div>
                            <h4 class="font-bold text-sm text-white">${ach.title}</h4>
                            <p class="text-xs text-slate-400">${ach.desc}</p>
                        </div>
                        <div>${actionBtn}</div>
                    </div>
                `;
            });
        }

        function checkAchievements() {
            achievementsList.forEach(ach => {
                if (!gameState.achievements[ach.id] && ach.check({ maxScore })) {
                    // Ready to claim
                }
            });
            saveGame();
        }

        function claimAchievement(id, reward) {
            gameState.achievements[id] = true;
            gameState.coins += reward;
            saveGame();
            renderAchievements();
        }

        // --- CANVAS GAME ENGINE ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let currentMode = 'solo';
        let score = 0;
        let gameRunning = false;

        // Ball physics
        let ball = {
            x: 0, y: 0, vx: 0, vy: 0, radius: 22, gravity: 0.4, bounce: -10.5
        };

        // Particles for spark effects
        let particles = [];

        function startGame(mode) {
            currentMode = mode;
            score = 0;
            document.getElementById('current-score').innerText = score;
            document.getElementById('main-menu').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            
            resizeCanvas();
            resetBall();
            gameRunning = true;
            requestAnimationFrame(gameLoop);
        }

        function returnToMenu() {
            gameRunning = false;
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('main-menu').classList.remove('hidden');
            if (score > maxScore) {
                maxScore = score;
                localStorage.setItem('jj_max_score', maxScore);
                checkAchievements();
            }
        }

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 3;
            ball.vx = (Math.random() - 0.5) * 4;
            ball.vy = -2;
        }

        // Tap/Click interaction to juggle
        window.addEventListener('pointerdown', (e) => {
            if (!gameRunning) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            // Check distance to ball
            const dist = Math.hypot(ball.x - x, ball.y - y);
            if (dist < ball.radius + 40) {
                // Kick / Jiggle upward
                ball.vy = ball.bounce;
                ball.vx += (ball.x - x) * 0.15;
                score++;
                document.getElementById('current-score').innerText = score;

                // Vibration feedback if supported
                if (navigator.vibrate) {
                    navigator.vibrate(40);
                }

                // Create spark particles
                for (let i = 0; i < 8; i++) {
                    particles.push({
                        x: ball.x,
                        y: ball.y,
                        vx: (Math.random() - 0.5) * 6,
                        vy: (Math.random() - 0.5) * 6,
                        color: currentSkinColor(),
                        life: 20
                    });
                }
            }
        });

        function currentSkinColor() {
            if (gameState.currentSkin === 'gold') return '#f59e0b';
            if (gameState.currentSkin === 'neon') return '#06b6d4';
            if (gameState.currentSkin === 'fire') return '#ef4444';
            return '#ffffff';
        }

        function gameLoop() {
            if (!gameRunning) return;

            // Update Physics
            ball.vy += ball.gravity;
            ball.x += ball.vx;
            ball.y += ball.vy;

            // Wall collisions
            if (ball.x - ball.radius < 0) { ball.x = ball.radius; ball.vx *= -0.8; }
            if (ball.x + ball.radius > canvas.width) { ball.x = canvas.width - ball.radius; ball.vx *= -0.8; }

            // Floor / Game over condition
            if (ball.y + ball.radius > canvas.height - 40) {
                gameRunning = false;
                if (score > maxScore) {
                    maxScore = score;
                    localStorage.setItem('jj_max_score', maxScore);
                    checkAchievements();
                }
                setTimeout(() => {
                    alert(`המשחק נגמר! השיגו: ${score} הקפצות.`);
                    returnToMenu();
                }, 100);
                return;
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life--;
                if (p.life <= 0) particles.splice(i, 1);
            }

            // Render
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Particles
            particles.forEach(p => {
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
                ctx.fill();
            });

            // Draw Ball
            ctx.save();
            ctx.translate(ball.x, ball.y);
            ctx.fillStyle = currentSkinColor();
            ctx.beginPath();
            ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = '#0f172a';
            ctx.stroke();

            // Ball pattern details
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(0, 0, ball.radius * 0.3, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            requestAnimationFrame(gameLoop);
        }

        // Initialize display coins on load
        document.getElementById('coins-display').innerText = gameState.coins;
    </script>
</body>
</html>
